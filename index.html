                    const curPos = p1.map((p,i) => p*(1-frac) + p2[i]*frac);
                    
                    const activeRunners = curPos.map((pos, i) => ({pos, i})).filter(r => r.pos < TRACK_LENGTH + 50);
                    let leadPos = activeRunners.length > 0 ? Math.max(...activeRunners.map(r => r.pos)) : TRACK_LENGTH + 150;

                    const leadData = getTrackPos(leadPos, 0);
                    playback.current.camX += (leadData.x - playback.current.camX) * 0.1;
                    
                    const cw = containerRef.current.clientWidth;
                    const ch = containerRef.current.clientHeight;
                    const tx = (cw * 0.35) - (playback.current.camX * ZOOM_SCALE);
                    const ty = (ch / 2) - (TRACK_CY * ZOOM_SCALE);
                    worldRef.current.style.transform = `translate(${tx}px, ${ty}px) scale(${ZOOM_SCALE})`;

                    let pipHtml = ''; 

                    // 🌟 선두 추적 및 메시지 발동
                    const curRanks = new Array(horses.length);
                    const curStandings = curPos.map((p,i)=>({i,p})).sort((a,b)=>b.p - a.p);
                    curStandings.forEach((s, r) => curRanks[s.i] = r);
                    
                    let newLeaderIdx = curStandings[0].i;
                    let progress = leadPos / TRACK_LENGTH;

                    if (progress > 0.1 && newLeaderIdx !== leadTracker.current.currentLeaderIdx && (t1 - leadTracker.current.lastLeadChangeTick) > 25) {
                        if (leadTracker.current.currentLeaderIdx !== -1 && evtContainerRef.current) {
                            const el = document.createElement('div');
                            el.className = "bg-black/80 backdrop-blur-md text-white px-4 py-2 rounded-xl text-base md:text-lg font-black border-l-4 border-yellow-400 shadow-xl animate-slide-in mb-2 w-fit";
                            el.innerText = `${horses[newLeaderIdx].name}: ${getMsg(EVENT_MSGS.lead)}`;
                            evtContainerRef.current.appendChild(el);
                            setTimeout(() => el.remove(), 3000);
                        }
                        leadTracker.current.currentLeaderIdx = newLeaderIdx;
                        leadTracker.current.lastLeadChangeTick = t1;
                    }


                    curPos.forEach((pos, i) => {
                        const lat = lats1[i]*(1-frac) + lats2[i]*frac;
                        const { x, y } = getTrackPos(pos, lat);
                        
                        if(horseRefs.current[i]) {
                            horseRefs.current[i].style.left = `${x}px`;
                            horseRefs.current[i].style.top = `${y}px`;
                            horseRefs.current[i].style.zIndex = Math.floor(y + 100);

                            const icon = horseRefs.current[i].querySelector('.runner-icon');
                            if(icon) {
                                if(spds[i] > 10) icon.classList.add('active');
                                else icon.classList.remove('active');
                            }
                        }

                        const screenX = tx + (x * ZOOM_SCALE);
                        if (screenX < -150) { 
                            pipHtml += `<div class="pip-item"><div class="pip-emoji">${horses[i].emoji}</div><div class="pip-info"><div class="pip-name">${horses[i].name}</div><div class="pip-dist">${Math.floor(pos)}m</div></div></div>`;
                        }
                        if(spds[i] > 60 && Math.random() < 0.1) createDust(x, y);
                    });

                    if(hudDistRef.current) hudDistRef.current.innerText = `${Math.min(Math.floor(Math.max(...curPos)), TRACK_LENGTH)}m`;
                    if(pipRef.current) pipRef.current.innerHTML = pipHtml;

                    // 일반 이벤트 처리 (선두 탈환 제외)
                    if (t1 !== playback.current.lastEvtTick && raceData.timeline[t1].events.length > 0) {
                        const evs = raceData.timeline[t1].events;
                        evs.forEach(e => {
                            if(evtContainerRef.current) {
                                const el = document.createElement('div');
                                el.className = "bg-black/80 backdrop-blur-md text-white px-4 py-2 rounded-xl text-base md:text-lg font-black border-l-4 border-yellow-400 shadow-xl animate-slide-in mb-2 w-fit";
                                el.innerText = `${horses[e.hIdx].name}: ${e.msg}`;
                                evtContainerRef.current.appendChild(el);
                                setTimeout(() => el.remove(), 3000);
                            }
                        });

                        const major = evs.find(e => e.msg.includes('기적') || e.msg.includes('스퍼트'));
                        if(major && cutinContainerRef.current && cutinContainerRef.current.innerHTML === '') { 
                            cutinContainerRef.current.innerHTML = `
                                <div class="w-full bg-gradient-to-r from-transparent via-red-600/95 to-transparent flex items-center justify-center animate-cutin py-6 shadow-[0_0_50px_rgba(220,38,38,0.8)] border-y border-red-400">
                                    <span class="text-[8rem] mr-8 inline-block drop-shadow-2xl">${horses[major.hIdx].emoji}</span>
                                    <span class="text-5xl font-black text-white italic drop-shadow-[0_6px_6px_#000] font-display">${horses[major.hIdx].name} - ${major.msg}</span>
                                </div>
                            `;
                            playSound('fanfare'); 
                            setTimeout(() => { if(cutinContainerRef.current) cutinContainerRef.current.innerHTML = ''; }, 2500); 
                        }
                        playback.current.lastEvtTick = t1;
                    }
                };
                animId = requestAnimationFrame(step);
                return () => cancelAnimationFrame(animId);
            }, [raceData, isHost]);

            if(!raceData) return <div className="h-full flex items-center justify-center"><div className="animate-spin rounded-full h-10 w-10 border-t-2 border-white"></div></div>;

            const pStart = { x: START_OFFSET - 2000, y: TRACK_CY };
            const pEnd = { x: START_OFFSET + TRACK_LENGTH * VISUAL_SCALE + 3000, y: TRACK_CY };
            const dPath = `M ${pStart.x} ${pStart.y} L ${pEnd.x} ${pEnd.y}`;

            const weatherClass = raceData.weather.id === 'RAIN' ? 'weather-rain' : (raceData.weather.id === 'HEAT' ? 'weather-heat' : (raceData.weather.id === 'WIND' ? 'weather-wind' : ''));
            const trackColorClass = `track-${raceData.weather.id}`;

            return (
                <div id="race-track-container" ref={containerRef} className={isSpurtCSS ? 'camera-shake slow-motion' : ''}>
                    
                    {weatherClass && <div className={`weather-layer ${weatherClass}`}></div>}

                    <div className="absolute top-8 left-1/2 -translate-x-1/2 z-40 flex flex-col items-center">
                        <div className="bg-black/80 px-10 py-3 rounded-2xl border-2 border-yellow-500 shadow-2xl text-center">
                            <div className="text-yellow-400 font-bold text-lg tracking-widest mb-[-8px]">🏁 GOAL: {TRACK_LENGTH}m</div>
                            <div ref={hudDistRef} className="text-white font-black text-6xl font-display drop-shadow-md">0m</div>
                        </div>
                        {raceData.weather.id !== 'SUNNY' && (
                            <div className="mt-2 bg-slate-800/80 px-4 py-1 rounded-full font-bold text-sm border border-slate-600 backdrop-blur-sm">
                                <span className={raceData.weather.color}>{raceData.weather.name}</span>
                            </div>
                        )}
                    </div>

                    <div id="pip-container" ref={pipRef}></div>
                    {isSpurtCSS && <div id="slow-mo-overlay"></div>}

                    <div id="track-world" ref={worldRef} className={trackColorClass}>
                        <svg className="track-path-svg" viewBox="0 0 120000 8000" preserveAspectRatio="none">
                            <path d={dPath} fill="none" stroke="#1e293b" strokeWidth="1200" strokeLinecap="square" />
                            <path d={dPath} fill="none" stroke="#334155" strokeWidth="1100" strokeLinecap="square" />
                            
                            {[-3,-2,-1,0,1,2,3,4].map(i => {
                                const offset = i * 120 - 60;
                                const lPath = `M ${pStart.x} ${pStart.y + offset} L ${pEnd.x} ${pEnd.y + offset}`;
                                return <path key={i} d={lPath} fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="12" strokeDasharray="100, 100" />;
                            })}
                            
                            <line x1={START_OFFSET} y1={pStart.y - 550} x2={START_OFFSET} y2={pStart.y + 550} stroke="white" strokeWidth="60" />
                            <line x1={START_OFFSET + TRACK_LENGTH * VISUAL_SCALE} y1={pEnd.y - 550} x2={START_OFFSET + TRACK_LENGTH * VISUAL_SCALE} y2={pEnd.y + 550} stroke="white" strokeWidth="60" />
                            <line x1={START_OFFSET + TRACK_LENGTH * VISUAL_SCALE + 60} y1={pEnd.y - 550} x2={START_OFFSET + TRACK_LENGTH * VISUAL_SCALE + 60} y2={pEnd.y + 550} stroke="#fbbf24" strokeWidth="60" strokeDasharray="60,60" />
                        </svg>

                        <div ref={dustLayerRef} className="absolute inset-0 pointer-events-none z-10"></div>
                        
                        {horses.map((h, i) => (
                            <div key={h.id} ref={el=>horseRefs.current[i]=el} className="runner">
                                <div className="runner-name-tag">
                                    <div className="name">{h.name}</div>
                                    {raceData.sponsors && raceData.sponsors[h.id] && (
                                        <div className="sponsor">🏆 {raceData.sponsors[h.id]}</div>
                                    )}
                                </div>
                                <div className="runner-icon drop-shadow-[0_15px_15px_rgba(0,0,0,0.8)]">{h.emoji}</div>
                            </div>
                        ))}
                    </div>

                    <div ref={evtContainerRef} className="absolute bottom-10 left-6 z-40 pointer-events-none flex flex-col items-start w-[500px] overflow-hidden"></div>
                    <div ref={cutinContainerRef} className="absolute top-1/3 inset-x-0 z-50 pointer-events-none overflow-visible"></div>
                </div>
            );
        }

        function ResultPhase({ me }) {
            return (
                <div className="h-full flex flex-col p-6 max-w-md mx-auto fade-in text-center items-center justify-center">
                    <h2 className="text-2xl font-black text-slate-300 mb-6">라운드 정산 결과</h2>
                    <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full shadow-lg mb-6 flex flex-col gap-2">
                        <div className="text-sm font-bold text-slate-400 mb-2">배팅 결과 (배팅금: {me.lastCost||0}💰)</div>
                        <div className="text-lg font-bold text-slate-300">당첨금: {Math.floor(me.lastGrossWin||0)} 💰</div>
                        <div className={`text-4xl font-black mt-2 ${me.lastWin>0?'text-red-400':(me.lastWin<0?'text-blue-400':'text-slate-300')}`}>{me.lastWin>0?'+':''}{Math.floor(me.lastWin||0)} 💰</div>
                        <div className="text-xs text-slate-500 font-bold mb-2">순수익</div>
                        <div className="mt-2 text-emerald-400 font-bold bg-slate-900 py-3 rounded-xl border border-slate-700 text-xl">최종 잔액: {Math.floor(me.money)} 💰</div>
                    </div>
                    <p className="text-slate-400 font-bold animate-pulse">호스트 대기중...</p>
                </div>
            );
        }

        // --- 공용 시상식 컴포넌트 ---
        function HorsePodium({ horses, ranks }) {
            const h1=horses[ranks[0]], h2=horses[ranks[1]], h3=horses[ranks[2]];
            return (
                <div className="flex justify-center items-end gap-3 h-56 mb-8 px-4">
                    <div className="w-1/3 flex flex-col items-center animate-rise" style={{animationDelay:'0.3s'}}>
                        <div className="text-4xl md:text-5xl mb-1">{h2.emoji}</div><div className="font-black text-sm md:text-base text-slate-300 truncate w-full text-center">{h2.name}</div>
                        <div className="w-full h-24 podium-2 rounded-t-xl mt-2 flex items-start justify-center pt-2 shadow-lg"><span className="font-black text-slate-700 text-2xl font-display">2</span></div>
                    </div>
                    <div className="w-[40%] flex flex-col items-center animate-rise z-10" style={{animationDelay:'0.6s'}}>
                        <div className="text-5xl md:text-6xl mb-1 animate-bounce">{h1.emoji}</div><div className="font-black text-base md:text-lg text-yellow-400 truncate w-full text-center">{h1.name}</div>
                        <div className="w-full h-36 podium-1 rounded-t-xl mt-2 flex items-start justify-center pt-3 shadow-2xl border-t border-yellow-200"><span className="font-black text-yellow-900 text-3xl font-display">1</span></div>
                    </div>
                    <div className="w-1/3 flex flex-col items-center animate-rise" style={{animationDelay:'0s'}}>
                        <div className="text-3xl md:text-4xl mb-1">{h3.emoji}</div><div className="font-black text-sm md:text-base text-orange-400 truncate w-full text-center">{h3.name}</div>
                        <div className="w-full h-16 podium-3 rounded-t-xl mt-2 flex items-start justify-center pt-1 shadow-lg"><span className="font-black text-orange-900 text-xl font-display">3</span></div>
                    </div>
                </div>
            );
        }

        function PlayerPodium({ players }) {
            const s = [...players].sort((a,b)=>b.money-a.money);
            const p1=s[0], p2=s[1], p3=s[2];
            return (
                <div className="flex justify-center items-end gap-3 h-56 mb-8 px-4">
                    {p2 && <div className="w-1/3 flex flex-col items-center animate-rise" style={{animationDelay:'0.3s'}}><div className="font-black text-base md:text-lg truncate w-full text-slate-200 text-center flex flex-col items-center gap-1"><AvatarDisplay avatarStr={p2.avatar} sizeClasses="w-8 h-8 text-base"/>{p2.name}</div><div className="text-xs text-emerald-400 font-bold mb-1">{Math.floor(p2.money)}</div><div className="w-full h-24 podium-2 rounded-t-xl mt-1 flex items-start justify-center pt-2 shadow-lg"><span className="font-black text-slate-700 text-2xl font-display">2</span></div></div>}
                    {p1 && <div className="w-[40%] flex flex-col items-center animate-rise z-10" style={{animationDelay:'0.6s'}}><div className="text-3xl mb-1">👑</div><div className="font-black text-lg md:text-xl text-yellow-400 truncate w-full drop-shadow-md text-center flex flex-col items-center gap-1"><AvatarDisplay avatarStr={p1.avatar} sizeClasses="w-10 h-10 text-xl"/>{p1.name}</div><div className="text-sm text-emerald-400 font-black mb-1">{Math.floor(p1.money)}</div><div className="w-full h-36 podium-1 rounded-t-xl mt-1 flex items-start justify-center pt-3 shadow-2xl border-t border-yellow-200"><span className="font-black text-yellow-900 text-3xl font-display">1</span></div></div>}
                    {p3 && <div className="w-1/3 flex flex-col items-center animate-rise" style={{animationDelay:'0s'}}><div className="font-black text-base md:text-lg truncate w-full text-orange-300 text-center flex flex-col items-center gap-1"><AvatarDisplay avatarStr={p3.avatar} sizeClasses="w-8 h-8 text-base"/>{p3.name}</div><div className="text-xs text-emerald-400 font-bold mb-1">{Math.floor(p3.money)}</div><div className="w-full h-16 podium-3 rounded-t-xl mt-1 flex items-start justify-center pt-1 shadow-lg"><span className="font-black text-orange-900 text-xl font-display">3</span></div></div>}
                </div>
            );
        }

        function SpecialAwards({ players }) {
            const active = players.filter(p=>p.stats.quizCnt>0 || p.stats.betWin>0 || p.stats.betLoss>0);
            if(active.length===0) return null;
            const a1 = [...active].sort((a,b)=>b.stats.quizCnt - a.stats.quizCnt)[0];
            const a2 = [...active].sort((a,b)=>b.stats.betWin - a.stats.betWin)[0];
            const a3 = [...active].sort((a,b)=>b.stats.betLoss - a.stats.betLoss)[0];
            const Card = ({icon, title, desc, name, val, cBorder, cText, avatarStr}) => (
                <div className={`bg-slate-800 p-5 rounded-2xl text-center border-t-4 ${cBorder} shadow-lg transform transition hover:scale-105 flex-1 mx-2 mb-4`}>
                    <div className="text-4xl mb-3">{icon}</div><div className={`text-lg font-black ${cText} mb-1`}>{title}</div><div className="text-[11px] text-slate-400 mb-3">{desc}</div>
                    <div className="flex justify-center mb-2"><AvatarDisplay avatarStr={avatarStr} sizeClasses="w-10 h-10 text-xl"/></div>
                    <div className="text-xl font-black text-white bg-slate-900 rounded-lg py-2 mb-2 truncate border border-slate-700 shadow-inner px-2">{name||'-'}</div><div className="text-emerald-400 font-black text-sm">{val}</div>
                </div>
            );
            return (
                <div className="flex flex-col md:flex-row justify-center max-w-4xl mx-auto w-full px-2">
                    <Card icon="🧠" title="지식의 탐구자" desc="퀴즈 최다 정답" name={a1?.name} avatarStr={a1?.avatar} val={`${a1?.stats.quizCnt||0}개`} cBorder="border-blue-500" cText="text-blue-400"/>
                    <Card icon="🃏" title="전설의 타짜" desc="배팅 순수익 1위" name={a2?.name} avatarStr={a2?.avatar} val={`+${a2?.stats.betWin||0}💰`} cBorder="border-red-500" cText="text-red-400"/>
                    <Card icon="💸" title="기부 천사" desc="배팅 손실액 1위" name={a3?.name} avatarStr={a3?.avatar} val={`-${a3?.stats.betLoss||0}💰`} cBorder="border-slate-500" cText="text-slate-400"/>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
