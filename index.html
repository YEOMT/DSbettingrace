        return audioCtx;

        const ctx = getAudioCtx(); const osc = ctx.createOscillator(); const gainNode = ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
        if(slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, ctx.currentTime + duration);
        gainNode.gain.setValueAtTime(vol, ctx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.connect(gainNode); gainNode.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + duration);
    };

    const loadCustomWordFile = (file) => {
        if (wordFileCache.has(file)) return wordFileCache.get(file);
        const promise = (async () => {
            if (!/\.txt$/i.test(file.name)) throw new Error('텍스트(.txt) 파일을 선택하세요.');
            if (file.size === 0) throw new Error('파일이 비어 있습니다.');
            if (file.size > 2 * 1024 * 1024) throw new Error('파일은 2MB 이하로 준비해 주세요.');
            const bytes = new Uint8Array(await withDeadline(readWordFileBuffer(file), '파일 읽기가 지연되었습니다. 파일을 다시 선택하세요.'));
            let text, encoding;
            const decode = label => new TextDecoder(label, {fatal: true}).decode(bytes);
            try {
                if (bytes[0] === 0xff && bytes[1] === 0xfe) { text = decode('utf-16le'); encoding = 'UTF-16 LE'; }
                else if (bytes[0] === 0xfe && bytes[1] === 0xff) { text = decode('utf-16be'); encoding = 'UTF-16 BE'; }
                else {
                    try { text = decode('utf-8'); encoding = 'UTF-8'; }
                    catch (e) {
                        try{text=decode('euc-kr');}catch{text=decodeCp949(bytes);}
                        encoding='EUC-KR / CP949';
                    }

            }
            return {...parseCustomWordText(text), encoding, filename: file.name};

    // All scheduled/final market changes use one deterministic, host-private plan.
    // Direct news effects keep their sign; unrelated stocks retain their original volatility.
    const weightedIndex = (values, random=Math.random()) => {
        const sum=values.reduce((a,x)=>a+(Number(x.weight)||0),0);let n=random*sum;
        for(let i=0;i<values.length;i++){n-=values[i].weight;if(n<0)return i;}return values.length-1;
    };
    const refillHeadlineBag = () => {availableHeadlineIndices=NEWS_EVENTS.map((_,i)=>i);};
    const chooseHeadline = () => {
        if(!availableHeadlineIndices.length) refillHeadlineBag();
        const groups=[{category:'basic',weight:60},{category:'chain',weight:30},{category:'comic',weight:10}]
            .filter(g=>availableHeadlineIndices.some(i=>NEWS_EVENTS[i].category===g.category));
        const category=groups[weightedIndex(groups)].category;
        let pool=availableHeadlineIndices.filter(i=>NEWS_EVENTS[i].category===category);
        const fresh=pool.filter(i=>!recentHeadlinePrimaries.slice(-2).includes(NEWS_EVENTS[i].primary));if(fresh.length)pool=fresh;
        const index=pool[Math.floor(Math.random()*pool.length)];
        availableHeadlineIndices.splice(availableHeadlineIndices.indexOf(index),1);
        recentHeadlinePrimaries.push(NEWS_EVENTS[index].primary);if(recentHeadlinePrimaries.length>4)recentHeadlinePrimaries.shift();
        return index;
    };
    // Symmetric four-way biotech trial. 20%/30%/30%/20% makes conditional mean exactly 1.
    // Near price limits the positive and negative ranges shrink together, without clipping bias.
    const bioTrialPrices = base => {
        const unit=Math.max(0,Math.floor(Math.min(base*.20,(MAX_PRICE-base)/3,(base-MIN_PRICE)/3)/10)*10);
        return [base+3*unit,base+unit,base-unit,base-3*unit];
    };
    const makeMarketPlan = (forcedEvent=null, forcedOutcome=null, rng=Math.random) => {
        const eventIndex=forcedEvent??chooseHeadline(),event=NEWS_EVENTS[eventIndex];
        const outcomeIndex=forcedOutcome??weightedIndex(event.results,rng()),outcome=event.results[outcomeIndex];
        const explicit=outcome.effects, factors={},notes=[];
        for(const s of roomState.stocks){
            if(Object.hasOwn(explicit,s.id)) {
                const effect=explicit[s.id];
                // Branch magnitudes are exact. Randomness belongs to branch selection, not contradictory labels.
                factors[s.id]=1+effect;
            } else factors[s.id]=1+(rng()*2-1)*s.vol;
        }
        const turn=roomState.turnCount+1;
        // News naming the biotech company replaces its autonomous trial that turn, avoiding double shocks.
        let bioIndex=null;
        if(turn%3===0&&!Object.hasOwn(explicit,'s4')) bioIndex=weightedIndex([{weight:20},{weight:30},{weight:30},{weight:20}],rng());
        // Lock a conditional factor at announcement, so detectors and settlement share one future direction.
        if(bioIndex!==null){
            const s=roomState.stocks.find(s=>s.id==='s4'),baseline=normalizePrice(s.price*factors.s4);
            const trial=bioTrialPrices(baseline)[bioIndex];factors.s4=trial/s.price;
            const labels=['대성공','부분 성공','보완 요구','실패'];
            notes.push(`🧬 YG바이오 3턴 특성: ${labels[bioIndex]} (상·하한 근처에서는 변동 폭 대칭 축소).`);
        } else if(turn%3===0)notes.push('🧬 YG바이오: 이번에는 해당 회사 뉴스가 자체 임상 특성을 대체합니다.');
        const downCount=roomState.stocks.filter(s=>normalizePrice(s.price*factors[s.id])<s.price).length;
        if(downCount>=6&&!Object.hasOwn(explicit,'s2')){
            factors.s2=Math.max(1,factors.s2)*1.15;
            notes.push('🛡️ KS디펜스 하락장 방어: 안전자산 수요로 상승 효과 적용.');
        }
        return {planId:makeId('market'),roundId:roomState.roundId,eventIndex,outcomeIndex,factors,notes,turn,bioIndex};
    };
    const projectMarket = (plan,stocks=roomState.stocks) => stocks.map(s=>{
        const nextPrice=normalizePrice(s.price*plan.factors[s.id]);
