    <style>

        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0f766e; color: #f8fafc; overflow: hidden; user-select: none; margin: 0; touch-action: manipulation; }
        .font-display { font-family: 'Black Han Sans', sans-serif; }
        
        .bg-glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes riseUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-rise { animation: riseUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* --- REAL RACE TRACK STYLES --- */
        #race-track-container { position: relative; width: 100%; height: 100%; overflow: hidden; background: #5c4033; box-shadow: inset 0 0 100px rgba(0,0,0,0.8); }
        /* The visible track is painted in a viewport canvas. Never rasterize a 120000px world. */
        .race-track-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index:0; pointer-events: none; }
        #track-world { position: absolute; inset: 0; z-index:5; pointer-events: none; }

        .runner { position: absolute; left: 0; top: 0; width: 220px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transform-origin: 0 0; will-change: transform; z-index: 20; }
        .runner-icon { font-size: 11rem; filter: drop-shadow(-15px 15px 15px rgba(0,0,0,0.7)); line-height: 1; }
        .runner-icon.active { animation: bounce 0.2s infinite alternate cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes bounce { from { transform: translateY(0) scaleY(0.95); } to { transform: translateY(-25px) scaleY(1.05); } }
        
        .runner-name-tag { display: flex; flex-direction: column; align-items: center; font-family: 'Black Han Sans', sans-serif; color: white; background: rgba(0, 0, 0, 0.85); padding: 6px 16px; border-radius: 16px; border: 4px solid #cbd5e1; box-shadow: 0 6px 15px rgba(0,0,0,0.6); white-space: nowrap; margin-bottom: -20px; text-shadow: 2px 2px 4px black; z-index: 21; position: relative; }
        .runner-name-tag .name { font-size: 2.2rem; font-weight: 900; line-height: 1; }
        .runner-name-tag .sponsor { font-family: 'Noto Sans KR', sans-serif; font-size: 1.2rem; color: #fde047; margin-top: 4px; font-weight: 900; background: rgba(255,255,255,0.15); padding: 4px 8px; border-radius: 6px; }
        
        .dust { position: absolute; width: 40px; height: 40px; background: rgba(220, 220, 220, 0.7); border-radius: 50%; animation: dustFade 0.7s forwards; pointer-events: none; z-index: 15; }
        @keyframes dustFade { 0% { transform: scale(0.5) translateY(0); opacity: 0.8; } 100% { transform: scale(5.0) translateY(-80px) translateX(-50px); opacity: 0; } }

        /* Weather Effects */
        .weather-layer { position: absolute; inset: 0; pointer-events: none; z-index: 35; }
        .weather-rain { inset:-120px; will-change:transform; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><line x1="50" y1="0" x2="30" y2="100" stroke="rgba(200,220,255,0.4)" stroke-width="2"/></svg>') repeat; background-size: 60px 60px; animation: rainDrop 0.3s linear infinite; }
        @keyframes rainDrop { from { transform:translate3d(20px,-50px,0); } to { transform:translate3d(0,50px,0); } }
        .weather-heat { background: rgba(255, 60, 0, 0.1); animation: heatHaze 2s infinite alternate; }
        @keyframes heatHaze { from { opacity: 0.6; } to { opacity: 1; } }
        .weather-wind { inset:-120px; will-change:transform; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><line x1="100" y1="50" x2="0" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/></svg>') repeat; background-size: 200px 100px; animation: windBlow 0.3s linear infinite; }
        @keyframes windBlow { from { transform:translate3d(100px,0,0); } to { transform:translate3d(-100px,0,0); } }
        .track-RAIN { filter: sepia(0.6) hue-rotate(190deg) brightness(0.6) saturate(0.7); }
        .track-HEAT { filter: sepia(0.3) saturate(1.5) hue-rotate(-15deg); }
        .track-WIND { filter: contrast(1.1) brightness(0.9); }

        .dramatic-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 10%, rgba(0,0,0,0.85) 100%); pointer-events: none; z-index: 18; opacity: 0; transition: opacity 0.8s; }
        #race-track-container.is-dramatic .dramatic-overlay { opacity: 1; }
        #race-track-container.is-dramatic .race-track-canvas { filter: brightness(0.5) saturate(1.2); }
        #race-track-container.is-dramatic .runner-icon { filter: brightness(1.6) drop-shadow(0 0 25px rgba(255,255,255,0.8)); }

        @keyframes slideIn { 0% { transform: translateX(-50px); opacity: 0; } 10% { transform: translateX(0); opacity: 1; } 90% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(-50px); opacity: 0; } }
        .animate-slide-in { animation: slideIn 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }

        @keyframes cheerBubble { 0% { transform: translateY(10px) scale(0.5); opacity: 1; } 50% { opacity: 1; } 100% { transform: translateY(-150px) scale(1.5); opacity: 0; } }
        .cheer-particle { animation: cheerBubble 1.2s ease-out forwards; position: absolute; bottom: 0; z-index: 100; pointer-events: none; filter: drop-shadow(0 0 5px rgba(255,255,255,0.8)); font-size: 3rem; }
        .runner-speed-trail { position:absolute; left:-114px; bottom:30px; width:130px; height:94px; opacity:0; pointer-events:none; background:linear-gradient(90deg,transparent,#ecfeffdd 60%,transparent) 0 7px/100px 6px no-repeat,linear-gradient(90deg,transparent,#fde68add 60%,transparent) 25px 40px/105px 5px no-repeat,linear-gradient(90deg,transparent,#ffffffaa 60%,transparent) 4px 73px/92px 4px no-repeat; }
        .runner.is-accelerating .runner-speed-trail { opacity:.9; animation:speedTrail .24s linear infinite; }
        @keyframes speedTrail { from { transform:translateX(18px); opacity:.9; } to { transform:translateX(-18px); opacity:.25; } }
        .runner-cheer-flame { position:absolute; right:-22px; top:-40px; opacity:0; font-size:64px; line-height:1; pointer-events:none; text-shadow:0 0 12px #f59e0b; }
        .runner.cheer-active .runner-cheer-flame { opacity:1; animation:cheerFlame .42s ease-in-out infinite alternate; }
        @keyframes cheerFlame { from { transform:translateY(4px) rotate(-8deg) scale(.9); } to { transform:translateY(-8px) rotate(8deg) scale(1.08); } }
        .runner.cheer-active .runner-name-tag { border-color:#facc15; box-shadow:0 0 18px #f59e0b9c,0 6px 15px #0009; }
        
        @keyframes cheerExplode { 0% { transform: scale(0.5); opacity: 1; } 50% { transform: scale(2.5); opacity: 0.8; } 100% { transform: scale(4); opacity: 0; } }
        .flash-horse { filter: brightness(2) sepia(0.8) hue-rotate(-30deg) saturate(3) drop-shadow(0 0 40px yellow) !important; transition: filter 0.1s; }

        #pip-container { position: absolute; left: 20px; top: 140px; bottom: 20px; width: 240px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; z-index: 50; pointer-events: none; }
        .pip-item { background: rgba(15, 23, 42, 0.9); border-left: 5px solid #ef4444; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(4px); box-shadow: 0 4px 15px rgba(0,0,0,0.6); animation: slideInLeft 0.3s forwards; }
        .pip-emoji { font-size: 3rem; }
        .pip-info { flex: 1; min-width: 0; }
        .pip-name { font-weight: 900; color: white; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pip-dist { color: #94a3b8; font-size: 0.9rem; font-weight: bold; font-family: monospace; }
        @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .podium-1 { background: linear-gradient(to top, #d4af37, #fdf5a9); box-shadow: 0 -10px 20px rgba(212, 175, 55, 0.4); }
        .podium-2 { background: linear-gradient(to top, #94a3b8, #e2e8f0); }
        .podium-3 { background: linear-gradient(to top, #b45309, #fdba74); }
        
        .skin-bronze { border: 3px solid #b87333; background: linear-gradient(135deg, #8c5220, #d99a6c); box-shadow: 0 0 10px rgba(184,115,51,0.4); }
        .skin-silver { border: 3px solid #c0c0c0; background: linear-gradient(135deg, #808080, #e0e0e0); box-shadow: 0 0 10px rgba(192,192,192,0.6); }
        .skin-gold { border: 3px solid #fbbf24; box-shadow: 0 0 20px #fbbf24, inset 0 0 10px #fbbf24; background: linear-gradient(135deg, #b45309, #fde047); position: relative; overflow: hidden; }
        .skin-gold::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent); transform: rotate(45deg); animation: holoGleam 2s infinite linear; }
        @keyframes holoGleam { 0% { transform: rotate(45deg) translateX(-100%); } 100% { transform: rotate(45deg) translateX(100%); } }
        /* A/B/D/E: presentation-only additions; simulation and payout rules are unchanged. */
        .race-host-shell { height:100dvh; min-height:0; overflow:hidden; }
        .race-host-body { min-height:0; }
        .weather-card { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; width:100%; min-width:0; padding:12px 16px; border:1px solid #64748b; border-radius:14px; background:#182b3d; line-height:1.5; flex-shrink:0; }
        .weather-card strong { white-space:nowrap; }
        .weather-card p { flex:1 1 260px; margin:0; color:#cbd5e1; font-size:13px; overflow-wrap:anywhere; word-break:keep-all; }
        .horse-intel { min-width:0; text-align:left; }
        .intel-tags { display:flex; flex-wrap:wrap; gap:5px; }
        .intel-tag { display:inline-flex; align-items:center; border:1px solid #475569; border-radius:7px; padding:3px 7px; font-size:11px; font-weight:900; line-height:1.5; background:#0f2232; }
        .intel-tag.favorable { color:#86efac; border-color:#166534; }
        .intel-tag.caution { color:#fda4af; border-color:#9f1239; }
        .intel-tag.variable { color:#fde68a; border-color:#a16207; }
        .intel-note { margin:7px 0 0; font-size:11px; line-height:1.6; color:#cbd5e1; word-break:keep-all; overflow-wrap:anywhere; }
        .intel-details { font-size:11px; color:#94a3b8; margin-top:6px; }
        .intel-details summary { cursor:pointer; padding:3px 0; }
        .intel-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; margin:7px 0; text-align:center; }
        .intel-stats span { background:#0f172a; border-radius:6px; padding:5px 2px; }
        .intel-stats b { display:block; color:#f8fafc; font-size:14px; }
        .betting-host-scroll { flex:1; min-height:0; overflow-y:auto; padding-right:4px; }
        .ready-panel { border:1px solid #475569; border-radius:12px; padding:10px 12px; background:#0f172a99; }
        .ready-counts { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:13px; font-weight:800; }
        .ready-roster { display:flex; flex-wrap:wrap; gap:5px; max-height:92px; overflow-y:auto; margin-top:8px; }
        .ready-person { padding:3px 7px; border:1px solid #475569; border-radius:6px; font-size:11px; color:#cbd5e1; }
        .ready-person.ready { color:#a7f3d0; background:#064e3b88; border-color:#059669; }
        .ready-person.offline { color:#fcd34d; border-style:dashed; }
        .bet-close-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid #f59e0b; border-radius:12px; padding:9px 13px; background:#78350f; color:#fef3c7; }
        .bet-close-number { font:900 32px/1 monospace; min-width:42px; text-align:center; color:#fde68a; }
        .bet-ready-footer { flex-shrink:0; background:#102e32; padding:9px 0 max(9px,env(safe-area-inset-bottom)); }
        .bet-ready-button { width:100%; padding:12px; border-radius:12px; font-weight:900; background:#059669; color:white; border:1px solid #34d399; }
        .bet-ready-button.is-ready { background:#123b35; color:#a7f3d0; }
        .bet-ready-button:disabled { opacity:.55; cursor:not-allowed; }
        .student-bet-summary { padding:12px; margin-bottom:8px; }
        .student-bet-scroll { min-height:0; }
        .cheer-student-shell { overflow-y:auto; justify-content:flex-start; }
        .cheer-student-shell > .cheer-student-card { margin:auto 0; padding:18px; }
        .cheer-meter { height:7px; background:#0f172a; border-radius:99px; overflow:hidden; border:1px solid #475569; }
        .cheer-meter > span { display:block; height:100%; background:linear-gradient(90deg,#34d399,#facc15,#fb7185); transition:width .3s ease; }
        .cheer-mini { width:100%; margin-top:10px; }
        .cheer-mini-label { display:flex; justify-content:space-between; gap:6px; font-size:10px; color:#fde68a; margin-bottom:5px; font-weight:800; }
        .cheer-sponsor-small { font-size:10px; color:#cbd5e1; margin-top:8px; line-height:1.5; overflow-wrap:anywhere; }
        .cheer-banner-slot { position:absolute; right:18px; bottom:22px; width:min(400px,calc(100% - 36px)); z-index:58; pointer-events:none; }
        .cheer-banner { color:#f8fafc; border:2px solid #facc15; border-radius:16px; padding:13px 16px; background:linear-gradient(120deg,#102c36f5,#31215cf5); box-shadow:0 8px 30px #0008,0 0 20px #facc1530; animation:bannerArrive .25s ease-out; }
        .cheer-banner .banner-title { color:#fde68a; font-size:12px; font-weight:900; letter-spacing:.08em; }
        .cheer-banner .banner-horse { font-size:23px; font-weight:900; margin:4px 0; overflow-wrap:anywhere; line-height:1.3; }
        .cheer-banner .banner-names { display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; }

        .cheer-burst-ring { position:absolute; left:50%; top:55%; width:160px; height:160px; margin:-80px; border:5px solid #fde047; border-radius:50%; animation:cheerRing .9s ease-out forwards; pointer-events:none; }
        .cheer-confetti { position:absolute; left:50%; top:50%; font-size:28px; animation:cheerConfetti 1.15s ease-out forwards; pointer-events:none; }
        @keyframes bannerArrive { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }

        .replay-mode .race-distance-hud, .all-finished .race-distance-hud { opacity:0; }
        .replay-mode #pip-container, .replay-mode .race-commentary,
        .replay-mode .race-cheer-ticker, .replay-mode .cheer-banner-slot,
        .all-finished .race-commentary, .all-finished .cheer-banner-slot { visibility:hidden; }

        .replay-mode .runner-speed-trail, .replay-mode .runner-cheer-flame { display:none; }

        .replay-brand { display:flex; align-items:center; gap:10px; flex-shrink:0; }
        .replay-brand strong { color:#fff; font-size:clamp(25px,3vw,36px); font-weight:900; font-style:italic; letter-spacing:.015em; line-height:1; text-shadow:0 2px 10px #000b; }
        .replay-mark { width:7px; height:25px; background:#fbbf24; transform:skew(-14deg); box-shadow:5px 0 #fbbf2444; margin-right:4px; }
        .replay-info { display:flex; flex-direction:column; align-items:flex-end; gap:3px; min-width:0; color:#f8fafc; text-align:right; font-weight:800; font-size:clamp(11px,1.5vw,14px); }
        .replay-info small { color:#cbd5e1; font-size:10px; font-weight:600; }
        .replay-progress { position:absolute; left:0; right:0; bottom:0; height:3px; background:#fbbf2420; }
        .replay-progress span { display:block; height:100%; background:#fbbf24; transform-origin:left; transform:scaleX(0); }
        .all-finished-label { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:65; padding:8px 20px; border-radius:99px; background:#020617d9; border:1px solid #94a3b8; color:#f8fafc; font-size:16px; font-weight:900; pointer-events:none; white-space:nowrap; }
        .replay-bottom { position:absolute; left:0; right:0; bottom:0; z-index:65; padding:20px 20px 13px; background:linear-gradient(transparent,#020617b3 30%,#020617eb); color:#f8fafc; pointer-events:none; }
        .replay-bottom-title { font-size:clamp(14px,2.1vw,24px); line-height:1.35; font-weight:900; color:#fef3c7; overflow-wrap:anywhere; }
        .replay-bottom-sub { color:#cbd5e1; font-size:clamp(10px,1.2vw,12px); line-height:1.6; margin-top:4px; }
        .replay-finish-details[hidden] { display:none; }
        .replay-flash { position:absolute; inset:0; background:#f8fafc; z-index:64; pointer-events:none; animation:replayShutter .32s ease-out forwards; }
        @keyframes replayShutter { 0% { opacity:.30; } 100% { opacity:0; } }
        .runner-timing-point { position:absolute; left:50%; bottom:6px; width:10px; height:10px; margin-left:-5px; transform:rotate(45deg); background:#f8fafc; border:2px solid #1e293b; box-shadow:0 0 0 2px #ffffff66; z-index:30; }
        .replay-mode .runner-timing-point { width:15px; height:15px; margin-left:-7.5px; background:#dbeafe; }
        .replay-freeze .runner.replay-winner .runner-timing-point { background:#fbbf24; box-shadow:0 0 0 3px #f8fafc,0 0 18px #fde047; }
        .replay-freeze .runner.replay-winner .runner-name-tag { color:#fef3c7; border-color:#fbbf24; }
        .track-finish-reference { opacity:0; }
        .replay-mode .track-finish-reference { opacity:1; }
        @media(max-width:640px) { .replay-broadcast { padding:10px 12px 16px; } .replay-bottom { padding:18px 12px 10px; } .replay-info small { font-size:9px; } }
        @media(prefers-reduced-motion:reduce) { .replay-flash { display:none; } }

        @media(max-height:650px) { .race-host-shell { padding:8px; } .race-host-shell > div:first-child { padding:8px 14px; margin-bottom:8px; } }

            const followAnchor = Math.max(width*.38,Math.min(width*.67,packSpan+95));
            const follow = followAnchor-leadX*zoom, locked = width*.73-finishX*zoom;
            // Smooth maximum: continuous tracking, then a gentle, fully stationary finish camera.
            const band = Math.min(60,width*.06), blend = Math.max(0,band-Math.abs(follow-locked));
            const tx = Math.max(follow,locked)+blend*blend/(4*band);
            const ty = top+usableHeight*.5-(4000+(low+high)*.5-10)*zoom;
            return { tx, ty, zoom };
        };
        const recordedRunnerPose = (tick, msPerTick, index, moving) => {
            if (!moving) return 'translateY(0px) scaleY(1)';
            const phase = (tick*msPerTick+index*37)/400*2*Math.PI, wave = (1-Math.cos(phase))*.5;
            return `translateY(${-25*wave}px) scaleY(${.95+.10*wave})`;
        };

        function HostView({ onExit }) {
            const [roomCode, setRoomCode] = useState('');
            const [quizTimeLeft, setQuizTimeLeft] = useState(30);
            const gameState = useRef(null);
            if (!gameState.current) gameState.current = initialGame();
            const [uiState, setUiState] = useState({ ...gameState.current });
            const [netMessage, setNetMessage] = useState('방을 준비하고 있습니다...');
            const transport = useRef({ ready: false, connected: false, closing: false, lost: false, code: '', instanceId: '', hostId: '', connectionId: newId(), dirty: false, inFlight: false, pending: [], waiting: [], last: {}, timer: null });
            const audioRef = useRef(null);

            const flushState = async () => {
                const t = transport.current;
                if (!t.ready || !t.connected || t.closing || t.lost || t.inFlight || !t.dirty) return;
                clearTimeout(t.timer); t.timer = null; t.dirty = false; t.inFlight = true;
                const state = gameState.current;
                const { players, customWords, raceData, finalPlayers, cheerBoard, ...publicState } = state;
                const pieces = { state: publicState, words: { version: state.wordVersion, items: customWords }, 'recovery/race': raceData, standings: finalPlayers };
                // The small shared cheer board is sent at most 2.5 times/sec, not with a full race timeline.
                if (state.status !== 'RACE' || t.cheerRound !== state.roundId || serverNow() - (t.lastCheerWrite || 0) >= 400) pieces.cheerBoard = cheerBoard;
                else if (t.last.cheerBoard !== JSON.stringify(cheerBoard)) t.dirty = true;
                players.forEach(p => { pieces[`players/${p.uid}`] = p; });
                const patch = {}, sent = {};
                Object.entries(pieces).forEach(([path, value]) => {
                    // Race frames are immutable once created; cheering must not serialize them again.
                    if (path === 'recovery/race' && t.lastRaceRef === value) return;
                    const serialized = JSON.stringify(value);
                    if (t.last[path] !== serialized) { patch[path] = JSON.parse(serialized); sent[path] = serialized; }
                });
                const actions = t.pending.splice(0); let failed = false;
                try {
                    if (Object.keys(patch).length) await window.fbUpdate(window.fbRef(window.firebaseDb, `rooms/${t.code}`), patch);
                    Object.assign(t.last, sent);
                    if (Object.hasOwn(sent, 'recovery/race')) t.lastRaceRef = raceData;
                    if (Object.hasOwn(sent, 'cheerBoard')) { t.lastCheerWrite = serverNow(); t.cheerRound = cheerBoard?.roundId || ''; }
                    // 결과/승인 기록이 저장된 뒤에만 처리한 요청을 지운다.
                    await Promise.all(actions.map(ref => window.fbRemove(ref).catch(() => {})));
                    if (!t.closing && !t.lost) setNetMessage('');
                } catch (error) {
                    failed = true; t.pending.unshift(...actions); t.dirty = true;
                    if (!t.closing && !t.lost) setNetMessage('저장이 지연되고 있습니다. 연결이 복구되면 다시 동기화합니다.');
                    console.warn('Room sync:', error);
                } finally {
                    t.inFlight = false;
                    if (t.dirty && t.ready && !t.closing && !t.lost) t.timer = setTimeout(flushState, failed ? 1000 : 100);
                }
            };
            const publishState = (immediate = false) => {
                const t = transport.current; t.dirty = true;
                setUiState({ ...gameState.current });
                if (immediate) { clearTimeout(t.timer); t.timer = null; flushState(); }
                else if (!t.timer) t.timer = setTimeout(() => { t.timer = null; flushState(); }, 100);
            };
            const recalcLiveOdds = () => {
                const state = gameState.current;
                const total = state.players.reduce((s, p) => s + Object.values(p.bets || {}).reduce((a, b) => a + b, 0), 0);
                state.horses.forEach(h => {
                    const bet = state.players.reduce((s, p) => s + (p.bets?.[h.id] || 0), 0);
                    let odds = ((total + state.horses.length * 800) / (bet + 800)) * 0.95;
                    odds = h.type === 'luck' ? Math.min(99, odds * 1.5) : Math.min(50, odds);
                    h.odds = Math.max(1.1, odds).toFixed(1);
                });
            };
            const canOperate = () => {
                const t = transport.current;
                if (!t.ready || !t.connected || t.lost || t.closing) { setNetMessage('연결 복구 후 다시 눌러 주세요. 현재 경기 기록은 유지됩니다.'); return false; }
                return true;
            };
            const changeStatus = newStatus => {
                if (!canOperate()) return;
                const state = gameState.current;
                const allowed = { LOBBY: ['QUIZ'], QUIZ: ['BETTING'], BETTING: ['RACE'], RACE: ['RESULT'], RESULT: ['QUIZ', 'END_PLAYER'], END_HORSE: ['END_PLAYER'], END_PLAYER: ['END_AWARDS'], END_AWARDS: ['LOBBY'] };
                if (!allowed[state.status]?.includes(newStatus)) return;
                if (newStatus === 'END_PLAYER' && (state.status === 'RESULT' || !state.finalPlayers?.length)) state.finalPlayers = cloneData(state.players.filter(p => p.hasParticipated));
                state.status = newStatus;
                if (newStatus === 'BETTING') { state.bettingEndsAt = 0; recalcLiveOdds(); }
                publishState(true);
            };
            const handleFileUpload = e => {
                const file = e.target.files?.[0]; e.target.value = '';
                if (!file || gameState.current.status !== 'LOBBY') return;
                const reader = new FileReader();
                reader.onerror = () => alert('단어장을 읽지 못했습니다. 파일을 다시 선택해 주세요.');
                reader.onload = evt => {
                    if (gameState.current.status !== 'LOBBY') return;
                    const { words, errors } = parseWordText(evt.target.result);
                    if (errors.length) { alert(`기존 단어장은 유지됩니다. 아래 항목을 수정해 주세요.\n${errors.slice(0, 10).join('\n')}${errors.length > 10 ? '\n외 ' + (errors.length - 10) + '건' : ''}`); return; }
                    gameState.current.customWords = words; gameState.current.wordVersion = newId();
                    publishState(true); alert(`${words.length}개의 단어가 성공적으로 업로드되었습니다!`);
                };
                reader.readAsText(file);
            };
            const resetQuizFor = p => {
                p.quizSeed = newId(); p.quizIndex = 0; p.quizCombo = 0; p.quizAvailableAt = 0; p.quizAck = null;
                p.betAck = null; p.lastBetSeq = 0; p.lastQuizSeq = 0; p.lastCheerSeq = 0; p.roundId = gameState.current.roundId;
            };
            const handlePlayerAction = data => {
                const t = transport.current, state = gameState.current, now = serverNow();
                if (!data || typeof data !== 'object' || data.instanceId !== t.instanceId || !/^[\w-]{1,80}$/.test(data.uid || '') || !/^[\w-]{1,80}$/.test(data.sessionId || '')) return;
                let player = state.players.find(p => p.uid === data.uid);
                if (data.type === 'JOIN') {
                    if (!Number.isFinite(data.sentAt) || data.sentAt < now - 60000 || data.sentAt > now + 10000) return;
                    if (player && player.sessionId !== data.sessionId && data.sentAt <= (player.sessionStartedAt || 0)) return;
                    const name = String(data.name || '').trim().replace(/[\u0000-\u001f\u007f]/g, '').slice(0, 10);
                    if (!name) return;
                    const avatar = typeof data.avatar === 'string' && /^\d+_(bronze|silver|gold)$/.test(data.avatar) ? data.avatar : '';
                    if (!player) {
                        player = { uid: data.uid, name, avatar, money: 10000, inventory: null, bets: {}, usedItemOn: null, isReady: false, hasParticipated: ['QUIZ', 'BETTING'].includes(state.status), stats: { quizCnt: 0, betWin: 0, betLoss: 0, totalBet: 0 }, lastCost: 0, lastGrossWin: 0, lastWin: 0 };

                            }

                            if (h.type === 'early' && progress > 0.5 && progress <= 0.85) targetSpeed *= 0.98; 

                            // 🌟 초반(진행률 30% 이하)에 도주마에게 무조건적인 부스터를 부여!
                            if (h.type === 'early' && progress < 0.3) {
                                targetSpeed *= 1.4; 
                            }
                            
                            
                            const spurtStart = h.type === 'late' ? 0.80 : 0.85;
                            
                            if (progress > spurtStart) {
                                const spurtFactor = (h.stats.spurt / 100) * 2.8; 
                                targetSpeed *= spurtFactor;
                                if (h.type === 'late') targetSpeed *= 2.15; 
                                if (weather === 'HEAT' && h.type === 'late') targetSpeed *= 0.9; 
                                
                                if (h.type === 'early') {
                                    if (curRanks[i] === 0 && curStandings.length > 1) {
                                        let distToSecond = positions[i] - curStandings[1].p;
                                        if (distToSecond > 150 || runaways[i]) { // 조건 완화: 300m -> 200m
                                            runaways[i] = true;
                                            targetSpeed *= 1.8; // 
                                            if (!triggered.runaway) {
                                                tickData.events.push({ hIdx: i, msg: '대도주 성공!! 아무도 잡을 수 없습니다!', type: 'lead'});
                                                triggered.runaway = true;
                                            }
                                        } else {
                                            targetSpeed *= 1.3; // 🌟 추가: 1등이지만 대도주가 아닐 때도 살짝 버티는 힘 부여
                                        }
                                    } else if (!runaways[i]) {
                                        targetSpeed *= 0.95; // 🌟 핵심 수정: 선두 뺏겼다고 확 죽어버리지 않게 0.8 -> 0.95로 완화
                                    }
                                }
                            } else if (h.type === 'chaser' && curRanks[i] > 0) {
                                // 사거리를 1000m로 늘리고, 범위 내에 들어오면 1.45배 속도로 맹추격
                                if (distToLeader < 1400) {
                                    targetSpeed *= 1.5;
                                } 
                                // 사정거리 밖에 있어도 포기하지 않고 1.25배의 기본 추격 속도 부여
                                else {
                                    targetSpeed *= 1.35; 
                                }
                            }
                            

                            // 1. 기본 추격 계수 상향 (2.5 -> 3.5)
                            let catchUp = (distToLeader / distance) * 3.5; 

                            // 2. 400m 이상 벌어졌을 때의 가속도 상향 (300 -> 200으로 나누어 더 큰 값 부여)
                            if (distToLeader > 400) catchUp += (distToLeader - 400) / 200; 

                            // 3. 🌟 (새로 추가) 경기가 60% 이상 진행됐을 때 끈을 더 강하게 당깁니다!
                            if (progress > 0.6) catchUp *= 1.5; 

                            if (h.type === 'late' && progress > 0.5) catchUp *= 1.8;
                            targetSpeed *= (1 + catchUp);

                            const baseLateral = (i - 3.5) * 120;
                            let desiredLateral = baseLateral, draftingBoost = 1.0;
                            const ahead = positions.map((p, j) => ({ j, gap: p - positions[i] }))
                                .filter(o => o.j !== i && o.gap > 5 && o.gap < 400 && Math.abs(laterals[i] - laterals[o.j]) < 145)
                                .sort((a, b) => a.gap - b.gap)[0];
                            if (ahead) {
                                desiredLateral += laterals[i] >= laterals[ahead.j] ? 80 : -80;
                                // Enable the formerly unreachable wake conservatively: <=3%, never stacked.
                                if (ahead.gap > 60 && progress > 0.1 && progress < 0.9) draftingBoost += 0.03 * (1 - ahead.gap / 400);
                            }
                            desiredLateral = Math.max(-440, Math.min(440, desiredLateral));
                            laterals[i] += (desiredLateral - laterals[i]) * 0.08;
                            targetSpeed *= draftingBoost;

                            curSpeeds[i] += (targetSpeed - curSpeeds[i]) * 0.15;
                            // Luck only makes a small, type-centered change to zero-mean fluctuation.
                            // No extra speed bonus or changed luck-type jackpot probabilities.
                            const luckNoise = 1 + ((luckCenters[h.type] || 50) - h.stats.luck) / 500;
                            momentums[i] += (Math.random() - 0.5) * ((100 - h.stats.stability) * 0.1) * luckNoise;
                            momentums[i] *= 0.9; 
                            
                            let finalSpeed = curSpeeds[i] + momentums[i];

                            const speedCap =
                            h.type === 'late' ? 175 :
                            h.type === 'chaser' ? 175 :
                            h.type === 'early' ? 170 :
                            h.type === 'luck' ? 180 :
                            155;

                            finalSpeed = Math.max(15, Math.min(finalSpeed, speedCap)); 

                            let prevPos = positions[i];
                            positions[i] += finalSpeed * (distance / 20000);
                            
                            if (prevPos < distance && positions[i] >= distance) {
                                exactFinishTimes[i] = t + (distance - prevPos) / (positions[i] - prevPos);
                            }

                            tickData.speeds.push(finalSpeed);
                            tickData.laterals.push(laterals[i]);

                            if (positions[i] < distance && t % 20 === 0 && progress > 0.3 && t > 50) {
                                let rankChange = prevRanks[i] - curRanks[i];
                                if (rankChange >= 2 && Math.random() < 0.5) {
                                    tickData.events.push({ hIdx: i, msg: getMsg(EVENT_MSGS.overtake), type: 'overtake'});
                                } else if (rankChange <= -2 && Math.random() < 0.3) {
                                    if (curRanks[i] > 3) tickData.events.push({ hIdx: i, msg: getMsg(EVENT_MSGS.disaster), type: 'disaster'});
                                    else tickData.events.push({ hIdx: i, msg: getMsg(EVENT_MSGS.slip), type: 'slip'});
                                }
                            }
                        }
                        
                        if (progress > 0.90 && progress < 0.92 && !triggered.lastSpurt) {
                            tickData.events.push({ hIdx: curStandings[0].i, msg: getMsg(EVENT_MSGS.lastSpurt), type: 'lastSpurt' });
                            triggered.lastSpurt = true;
                        }
                        if (maxPos < distance && t % 10 === 0 && progress > 0.5 && curStandings.length > 1) {
                            if (Math.abs(curStandings[0].p - curStandings[1].p) < 20 && Math.random() < 0.2) {
                                tickData.events.push({ hIdx: curStandings[0].i, msg: getMsg(EVENT_MSGS.neckAndNeck), type: 'neckAndNeck' });
                            }
                        }

                        prevRanks = [...curRanks];
                        tickData.positions = [...positions];
                        timeline.push(tickData);
                        
                        if (Math.min(...positions) >= distance + 100) break; 
                    }

                    const finalRanks = horses.map((_, i) => i).sort((a, b) => exactFinishTimes[a] - exactFinishTimes[b]);
                    
                    state.raceData = { timeline, ranks: finalRanks, exactFinishTimes, distance, sponsors, sponsorLeaders, weather: state.weather, matchId: state.matchId, roundId: state.roundId,
                        settlement: { players: lockedPlayers, horses: horses.map(h => ({ id: h.id, odds: h.odds })) } };
                    lockedPlayers.forEach(locked => {
                        const p = state.players.find(p => p.uid === locked.uid);
                        if (p && locked.usedItemOn?.target === 'horse') p.inventory = null;
                    });
                    state.cheerBoard = { roundId: state.roundId, horses: {}, sponsors: sponsorLeaders }; state.racePresentation = 'LIVE';
                    changeStatus('RACE');
                    
                } catch (e) {
                    gameState.current.bettingEndsAt = 0; publishState(true);
                    alert("레이스 계산 중 오류 발생: " + e.message);
                    console.error(e);
                }
            };

            const forceStopRace = () => { if (gameState.current.status === 'RACE') processResults(gameState.current.roundId); };
            const processResults = expectedRoundId => {
                const state = gameState.current, race = state.raceData;
                if (state.status !== 'RACE' || !race?.settlement || race.roundId !== state.roundId || (expectedRoundId && expectedRoundId !== state.roundId) || state.settledRoundId === state.roundId || transport.current.lost) return;
                const winningIds = race.ranks.slice(0, 3).map(i => race.settlement.horses[i].id);
                const odds = Object.fromEntries(race.settlement.horses.map(h => [h.id, Number(h.odds)]));
                const outcomes = race.settlement.players.map(locked => {
                    let win = 0, cost = 0;
                    Object.entries(readBets(locked.bets)).forEach(([id, amount]) => {
                        cost += amount; const place = winningIds.indexOf(Number(id));
                        if (place >= 0) win += amount * odds[id] * [1, 0.5, 0.2][place];
                    });
                    if (locked.usedItemOn?.target === 'self') {
                        if (locked.inventory === 'coin') win = locked.coinWin ? win * 2 : 0;
                        if (locked.inventory === 'insurance' && win < cost) win += cost * 0.25;
                    }
                    return { locked, cost: Math.round(cost), win: Math.round(win) };
                });
                state.settledRoundId = state.roundId;
                outcomes.forEach(({ locked, cost, win }) => {
                    const p = state.players.find(p => p.uid === locked.uid); if (!p) return;
                    p.money = Math.round(p.money + win - cost);
                    p.stats.betWin += Math.max(0, win - cost); p.stats.betLoss += Math.max(0, cost - win); p.stats.totalBet = (p.stats.totalBet || 0) + cost;
                    if (locked.usedItemOn?.target === 'self') p.inventory = null;
                    p.lastCost = cost; p.lastGrossWin = win; p.lastWin = win - cost;
                });
                // One atomic network update contains both the settlement marker and all balances.
                state.status = 'RESULT'; publishState(true);
            };
            const handleRematch = () => {
                if (!canOperate() || gameState.current.status !== 'END_AWARDS') return;

                gameState.current = { ...initialGame(), players: old.players, customWords: old.customWords, wordVersion: old.wordVersion, totalRounds: old.totalRounds };

                    resetQuizFor(p);
                });
                publishState(true);
            };
            const changeTotalRounds = value => {
                const state = gameState.current, count = Number(value);
                if (!Number.isSafeInteger(count) || count < Math.max(1, state.round) || count > 10 ||
                    !['LOBBY','QUIZ','BETTING','RACE','RESULT'].includes(state.status) || !canOperate()) return;
                state.totalRounds = count;
                publishState(true);
            };

            return (
                <div className="race-host-shell bg-teal-900 text-white p-4 flex flex-col fade-in relative">

                        {uiState.status === 'RACE' && (

                                <i className="fas fa-forward"></i> 경주 스킵 (결과 보기)
                            </button>

                        <div className="text-right"><div className="text-sm font-bold text-slate-400">참가자: {uiState.players.length}명 · 접속 {uiState.players.filter(p=>p.connected).length}명</div><div className="text-xl font-bold flex items-center justify-end gap-2">라운드: {uiState.round} / {['LOBBY','QUIZ','BETTING','RACE','RESULT'].includes(uiState.status) ? <select aria-label="전체 라운드 수" title="전체 라운드 수 변경" value={uiState.totalRounds} onChange={e=>changeTotalRounds(e.target.value)} className="bg-slate-700 text-yellow-300 border border-slate-500 rounded-lg px-2 py-1 outline-none cursor-pointer focus:border-yellow-400">{Array.from({length:10},(_,i)=>i+1).map(n=><option key={n} value={n} disabled={n<uiState.round}>{n}</option>)}</select> : uiState.totalRounds}</div><button onClick={closeRoom} className="text-xs text-slate-400 underline mt-1">방 닫기</button></div>
                    </div>

                    {netMessage && <div className="bg-amber-900/80 text-yellow-100 text-sm font-bold p-2 rounded-lg mb-2 text-center">{netMessage}{!roomCode && <button onClick={()=>location.reload()} className="ml-3 underline">다시 불러오기</button>}</div>}
                    <div className="race-host-body flex-1 bg-glass rounded-2xl border border-slate-600 flex flex-col overflow-hidden relative">

                                <div className="mx-auto mb-6 w-fit min-w-[240px] bg-emerald-950/90 border-2 border-emerald-400 rounded-2xl px-8 py-3 shadow-[0_0_26px_rgba(52,211,153,.25)]" role="status" aria-label={`참가 방 번호 ${roomCode}`}>

                                <div className="flex flex-wrap justify-center gap-3 mb-8 min-h-[100px] content-start">
                                    {uiState.players.map(p => (
                                        <div key={p.uid} className="flex items-center gap-2 bg-indigo-900/50 pr-4 rounded-full border border-indigo-500/50 font-bold shadow-md">

                                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-3 pb-2">

                                <div className="shrink-0">{uiState.bettingEndsAt?<CountdownBar endsAt={uiState.bettingEndsAt} onCancel={cancelBettingCountdown}/>:<button onClick={beginBettingCountdown} className="w-full bg-red-600 hover:bg-red-500 text-white font-black py-3 rounded-xl text-xl shadow-lg active:scale-95 transition" data-testid="begin-countdown">5초 후 배팅 마감 · 경주 시작 🏁</button>}</div>
                            </div>

                        {uiState.status === 'RACE' && (
                            <div className="absolute inset-0 z-10 bg-teal-900 rounded-2xl overflow-hidden border-4 border-slate-600 shadow-2xl">
                                <RacePhase raceData={uiState.raceData} horses={uiState.horses} cheerBoard={uiState.cheerBoard} isHost={true} onFinish={processResults} onPresentation={reportRacePresentation} />

                        {uiState.status === 'RESULT' && (
                            <div className="m-auto text-center w-full max-w-4xl z-20 p-6 overflow-y-auto custom-scrollbar max-h-full">
                                <div className="mb-8 flex justify-center sticky top-0 z-30">
                                    {uiState.round < uiState.totalRounds ? 
                                        <button onClick={startRound} className="bg-emerald-600 px-10 py-4 rounded-xl font-black text-xl shadow-lg hover:bg-emerald-500">다음 라운드 준비 ➡️</button>
                                    : 
                                        <button onClick={()=>changeStatus('END_PLAYER')} className="bg-red-600 px-10 py-4 rounded-xl font-black text-xl shadow-lg hover:bg-red-500">게임 종료 (최종 랭킹 보기) ➡️</button>
                                    }
                                </div>
                                <h2 className="text-4xl font-black text-purple-400 mb-5">🏆 {uiState.round}라운드 결과</h2>
                                <FinishSummary race={uiState.raceData} horses={uiState.horses}/>
                                <HorsePodium horses={uiState.horses} ranks={uiState.raceData.ranks} />
                                <div className="bg-slate-800 rounded-xl p-4 mb-8 border border-slate-700 shadow-md">
                                    <h3 className="text-xl font-bold mb-4 border-b border-slate-600 pb-2">현재 재산 순위</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3 text-left">
                                        {[...uiState.players].sort((a,b)=>b.money-a.money).slice(0,9).map((p,i)=>(
                                            <div key={p.uid} className="flex justify-between items-center bg-slate-700 px-3 py-2 rounded-lg font-bold"><span className="truncate flex items-center gap-2"><AvatarDisplay avatarStr={p.avatar} sizeClasses="w-6 h-6 text-xs"/>{i+1}. {p.name}</span><span className="text-emerald-400 shrink-0">{Math.floor(p.money)}💰</span></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {uiState.status === 'END_PLAYER' && (
                            <div className="m-auto text-center w-full p-6 max-h-full overflow-y-auto custom-scrollbar relative">
                                <div className="mb-4 flex justify-center sticky top-0 z-30">
                                    <button onClick={()=>changeStatus('END_AWARDS')} className="bg-blue-600 px-10 py-4 rounded-xl font-black text-xl shadow-lg hover:bg-blue-500">특별 시상식 ➡️</button>
                                </div>
                                <h2 className="text-5xl font-black text-yellow-400 mb-12 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)] font-display tracking-widest mt-2">🎉 경마왕 랭킹 🎉</h2>
                                <PlayerPodium players={uiState.finalPlayers} />
                                
                                <div className="mt-8 bg-slate-800 p-6 rounded-2xl border border-slate-600 max-w-2xl mx-auto w-full mb-8">
                                    <h3 className="text-2xl font-bold mb-4 text-slate-300 border-b border-slate-700 pb-3">전체 랭킹 보드</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        {[...uiState.finalPlayers].sort((a,b)=>b.money-a.money).map((p, i) => (

                                                <span className="font-bold flex items-center gap-3 text-lg"><AvatarDisplay avatarStr={p.avatar} sizeClasses="w-8 h-8 text-sm"/>{i+1}위. {p.name}</span>
                                                <span className="text-emerald-400 font-black text-xl">{Math.floor(p.money)} 💰</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                        {uiState.status === 'END_AWARDS' && (
                            <div className="m-auto text-center w-full max-w-5xl p-6 overflow-y-auto custom-scrollbar max-h-full">
                                <div className="mb-12 flex justify-center gap-6 sticky top-0 z-30">
                                    <button onClick={handleRematch} className="bg-indigo-600 hover:bg-indigo-500 px-8 py-4 rounded-xl font-black text-xl shadow-lg transition-transform hover:scale-105">같은 멤버로 1라운드 다시 시작</button>
                                    <button onClick={closeRoom} className="bg-slate-700 hover:bg-slate-600 border border-slate-500 px-8 py-4 rounded-xl font-black text-xl shadow-lg">방 폭파 (처음으로)</button>
                                </div>
                                <h2 className="text-5xl font-black text-purple-400 mb-12 drop-shadow-md font-display tracking-wider">🌟 특별 시상식 🌟</h2><SpecialAwards players={uiState.finalPlayers} />
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function PlayerView({ roomCode, playerName, myUid, myAvatar, onExit }) {
            const [roomState, setRoomState] = useState(null);
            const [me, setMe] = useState(null);
            const [combo, setCombo] = useState(0);
            const [quizData, setQuizData] = useState(null);
            const [myBets, setMyBets] = useState({});
            const [usedItem, setUsedItem] = useState(null);
            const [cheerCooldown, setCheerCooldown] = useState(false);
            const [rewardClaimed, setRewardClaimed] = useState(false);
            const [rewardDetails, setRewardDetails] = useState(null);
            const [timeLeft, setTimeLeft] = useState(30);
            const [quizPopup, setQuizPopup] = useState(null);
            const [isItemSelecting, setIsItemSelecting] = useState(false);
            const [wordBank, setWordBank] = useState({ version: '', items: [] });
            const [finalPlayers, setFinalPlayers] = useState([]);
            const [netMessage, setNetMessage] = useState('');
            const [betNotice, setBetNotice] = useState('');
            const [myReady, setMyReady] = useState(false);
            const [bettingClosed, setBettingClosed] = useState(false);
            const [cheerBoard, setCheerBoard] = useState(null);
            const [quizNotice, setQuizNotice] = useState('');
            const client = useRef(null);
            if (!client.current) client.current = { sessionId: newId(), seq: 0, instanceId: '', meta: null, state: null, me: null, words: null, connected: false, hostOnline: false, joinedAt: 0, draftBets: {}, draftItem: null, draftReady: false, pendingBet: null, pendingQuiz: null, quizTimer: null, cheerTimer: null, betTimer: null, disposed: false };

            const syncDraft = () => {
                const c = client.current, p = c.me, state = c.state;
                if (!p || !state || p.roundId !== state.roundId) return;
                const ack = p.betAck;
                const caughtUp = ack?.sessionId === c.sessionId && ack.seq >= (c.pendingBet?.seq || Infinity);
                if (!c.pendingBet || caughtUp || state.status !== 'BETTING') {
                    c.draftBets = { ...(p.bets || {}) }; c.draftItem = p.usedItemOn || null; c.draftReady = p.isReady === true; setMyReady(c.draftReady);
                    setMyBets(c.draftBets); setUsedItem(c.draftItem);
                    if (c.pendingBet) {
                        setBetNotice(caughtUp ? (ack.ok ? (p.isReady ? '준비 완료가 반영되었습니다.' : '배팅 반영 완료') : ack.reason) : '배팅 마감: 호스트가 승인한 내역으로 확정되었습니다.');
                        c.pendingBet = null; clearTimeout(c.betTimer);
                    }
                }
            };
            const canAct = status => {
                const c = client.current;
                return !c.disposed && c.connected && c.hostOnline && c.me?.sessionId === c.sessionId && c.state?.status === status && c.me?.roundId === c.state?.roundId && (status !== 'BETTING' || betIsOpen(c.state)) && (status !== 'RACE' || c.state.racePresentation !== 'FINISH');
            };
            const pushAction = async action => {
                const c = client.current;
                if (!c.instanceId || !c.connected || !c.state || c.disposed) return false;
                try {
                    await window.fbPush(window.fbRef(window.firebaseDb, `rooms/${roomCode}/actions`), { ...action, uid: myUid, sessionId: c.sessionId, instanceId: c.instanceId, matchId: c.state.matchId, roundId: c.state.roundId, sentAt: serverNow() });
                    return true;
                } catch (e) { if (!c.disposed) setNetMessage('요청 전송에 실패했습니다. 연결을 확인해 주세요.'); return false; }
            };
            const tryJoin = () => {
                const c = client.current;
                if (!c.state || !c.instanceId || !c.connected || !c.hostOnline || c.disposed) return;
                if (c.me?.sessionId !== c.sessionId) {
                    if (serverNow() - c.joinedAt < 2000) return;
                    c.joinedAt = serverNow();
                    pushAction({ type: 'JOIN', name: playerName, avatar: myAvatar });
                } else pushAction({ type: 'PING' });
            };
            useEffect(() => {
                const c = client.current, base = `rooms/${roomCode}`; const unsubs = [];
                const fail = e => { if (!c.disposed) setNetMessage('연결 오류: ' + (e?.message || String(e))); };
                const updatePresence = () => {
                    const active = c.meta?.activeHostSession;
                    const presence = c.presences?.[active];
                    c.hostOnline = !!(presence?.online && serverNow() - (presence.at || 0) < 90000);
                    if (!c.connected) setNetMessage('연결이 끊겼습니다. 기록을 유지하며 재연결 중입니다.');
                    else if (!c.hostOnline) setNetMessage('선생님 연결을 기다리고 있습니다. 현재 기록은 유지됩니다.');
                    else setNetMessage('');
                    tryJoin();
                };
                unsubs.push(window.fbOnValue(window.fbRef(window.firebaseDb, `${base}/meta`), snap => {
                    const meta = snap.val();
                    if (!meta) { alert('방이 존재하지 않거나 호스트가 게임을 종료했습니다.'); onExit(); return; }
                    if (meta.schema !== ROOM_SCHEMA) { setNetMessage('호스트와 학생 모두 새로고침하여 같은 버전으로 접속해 주세요.'); return; }
                    if (meta.expiresAt < serverNow()) { setNetMessage('오랫동안 사용하지 않아 만료된 방입니다. 새 방으로 접속해 주세요.'); return; }
                    if (c.instanceId && c.instanceId !== meta.instanceId) { alert('이전 방이 종료되었습니다. 새 방 번호로 다시 접속해 주세요.'); onExit(); return; }
                    c.meta = meta; c.instanceId = meta.instanceId; updatePresence();
                }, fail));
                unsubs.push(window.fbOnValue(window.fbRef(window.firebaseDb, `${base}/hostPresence`), snap => { c.presences = snap.val() || {}; updatePresence(); }, fail));
                unsubs.push(window.fbOnValue(window.fbRef(window.firebaseDb, '.info/connected'), snap => { c.connected = snap.val() === true; updatePresence(); }, fail));
                unsubs.push(window.fbOnValue(window.fbRef(window.firebaseDb, `${base}/state`), snap => {
                    const state = snap.val();
                    if (!state?.matchId) return;
                    c.state = { ...state, horses: asArray(state.horses) }; setRoomState(c.state); syncDraft(); tryJoin();
                }, fail));
                unsubs.push(window.fbOnValue(window.fbRef(window.firebaseDb, `${base}/players/${myUid}`), snap => {
                    const p = snap.val(); if (!p) return;
                    c.me = { ...p, bets: readBets(p.bets) }; setMe(c.me); syncDraft();
                }, fail));
                unsubs.push(window.fbOnValue(window.fbRef(window.firebaseDb, `${base}/words`), snap => {
                    const v = snap.val(); if (!v) return;
                    c.words = { version: v.version, items: asArray(v.items) }; setWordBank(c.words);
                }, fail));
                unsubs.push(window.fbOnValue(window.fbRef(window.firebaseDb, `${base}/standings`), snap => setFinalPlayers(asArray(snap.val())), fail));
                const ping = setInterval(updatePresence, 3000);
                return () => {
                    c.disposed = true; clearInterval(ping); clearTimeout(c.quizTimer); clearTimeout(c.cheerTimer); clearTimeout(c.betTimer); unsubs.forEach(fn => fn());
                };
            }, [roomCode]);

            useEffect(() => {
                const tick = () => setBettingClosed(roomState?.status === 'BETTING' && !!roomState.bettingEndsAt && serverNow() >= roomState.bettingEndsAt);
                tick(); if (roomState?.status !== 'BETTING' || !roomState.bettingEndsAt) return;
                const timer = setInterval(tick, 100); return () => clearInterval(timer);
            }, [roomState?.status, roomState?.bettingEndsAt, roomState?.roundId]);
            useEffect(() => {
                setCheerBoard(null);
                if (roomState?.status !== 'RACE') return;
                return window.fbOnValue(window.fbRef(window.firebaseDb, `rooms/${roomCode}/cheerBoard`), snap => {
                    const board=snap.val(); if (board?.roundId === client.current.state?.roundId) setCheerBoard(board);
                }, () => {});
            }, [roomCode, roomState?.roundId, roomState?.status]);
            const generateQuiz = () => {
                const c = client.current;
                if (c.state?.status !== 'QUIZ' || c.me?.roundId !== c.state.roundId || c.me?.sessionId !== c.sessionId || c.words?.version !== c.state.wordVersion) { setQuizData(null); return; }
                const words = c.words.items.length > 0 ? c.words.items : DEFAULT_WORDS;
                setQuizData(makeQuiz(words, c.me.quizSeed, c.me.quizIndex || 0));
            };
            const finishQuizFeedback = () => {
                const c = client.current, pending = c.pendingQuiz;
                if (!pending || c.disposed) return;
                const ack = c.me?.quizAck;
                const acknowledged = ack?.sessionId === c.sessionId && ack.seq >= pending.seq;
                const readyAt = Math.max(pending.showUntil, acknowledged && ack.ok ? (c.me.quizAvailableAt || 0) : 0);
                if (serverNow() < readyAt) { c.quizTimer = setTimeout(finishQuizFeedback, readyAt - serverNow()); return; }
                if (ack?.sessionId !== c.sessionId || ack.seq < pending.seq) { setQuizNotice('정답 확인 중...'); return; }
                c.pendingQuiz = null; setQuizPopup(null); setCombo(c.me?.quizCombo || 0);
                setQuizNotice(ack.ok ? '' : ack.reason); generateQuiz();
            };
            useEffect(() => {
                if (client.current.pendingQuiz) finishQuizFeedback();
                else { setCombo(me?.quizCombo || 0); generateQuiz(); }
            }, [me?.quizIndex, me?.quizSeed, me?.quizAck?.seq, me?.sessionId, wordBank.version, roomState?.roundId, roomState?.status]);
            useEffect(() => {
                const c = client.current;
                clearTimeout(c.quizTimer); clearTimeout(c.cheerTimer); clearTimeout(c.betTimer);
                c.pendingQuiz = null; c.pendingBet = null; setQuizPopup(null); setQuizNotice(''); setBetNotice(''); setIsItemSelecting(false); setCheerCooldown(false);
                if (roomState?.status !== 'QUIZ') { setQuizData(null); setCombo(0); }
                else generateQuiz();
                syncDraft();
            }, [roomState?.matchId, roomState?.roundId, roomState?.status]);
            useEffect(() => {
                if (roomState?.status !== 'QUIZ') return;
                const tick = () => setTimeLeft(Math.max(0, Math.ceil(((client.current.state?.quizEndsAt || 0) - serverNow()) / 1000)));
                tick(); const timer = setInterval(tick, 200); return () => clearInterval(timer);
            }, [roomState?.status, roomState?.roundId, roomState?.quizEndsAt]);
            useEffect(() => { setRewardClaimed(false); setRewardDetails(null); }, [roomState?.matchId]);
            useEffect(() => {
                if (!['END_PLAYER', 'END_AWARDS'].includes(roomState?.status) || rewardClaimed || !finalPlayers.some(p => p.uid === myUid)) return;
                let active = true;
                claimReward(roomState.matchId, myUid, finalPlayers).then(details => { if (active && details) { setRewardDetails(details); setRewardClaimed(true); } }).catch(e => { if (active) setNetMessage(e.message); });
                return () => { active = false; };
            }, [roomState?.status, roomState?.matchId, finalPlayers, myUid, rewardClaimed]);

            const handleQuizAnswer = optionIndex => {
                const c = client.current;
                if (!canAct('QUIZ') || c.pendingQuiz || !quizData || serverNow() < (c.me.quizAvailableAt || 0) || serverNow() >= c.state.quizEndsAt) return;
                if (!Number.isSafeInteger(optionIndex) || optionIndex < 0 || optionIndex >= quizData.options.length) return;
                const correct = quizData.options[optionIndex] === quizData.answer.kor, seq = ++c.seq;
                c.pendingQuiz = { seq, showUntil: serverNow() + (correct ? 600 : 1500) };
                setQuizPopup(correct ? 'correct' : 'wrong'); setQuizNotice(''); setCombo(correct ? (c.me.quizCombo || 0) + 1 : 0);
                playSound(correct ? 'combo' : 'wrong');
                c.quizTimer = setTimeout(finishQuizFeedback, correct ? 600 : 1500);
                pushAction({ type: 'QUIZ_ANSWER', seq, index: quizData.index, optionIndex }).then(ok => {
                    if (!ok && c.pendingQuiz?.seq === seq && !c.disposed) { clearTimeout(c.quizTimer); c.pendingQuiz = null; setQuizPopup(null); setQuizNotice('전송되지 않았습니다. 다시 선택해 주세요.'); generateQuiz(); }
                });
            };
            const sendBet = (bets, item, ready = false) => {
                const c = client.current;
                if (!canAct('BETTING')) return;
                const seq = ++c.seq; c.pendingBet = { seq }; c.draftBets = { ...bets }; c.draftItem = item; c.draftReady = ready; setMyReady(ready);
                setMyBets(c.draftBets); setUsedItem(item); setBetNotice('배팅 전송 중...');
                clearTimeout(c.betTimer);
                c.betTimer = setTimeout(() => { if (c.pendingBet?.seq === seq && !c.disposed) setBetNotice('호스트 승인 대기 중입니다. 마감 시 승인된 내역만 적용됩니다.'); }, 5000);
                pushAction({ type: 'BET_CHANGE', seq, bets, usedItemOn: item, isReady: ready }).then(ok => {
                    if (!ok && c.pendingBet?.seq === seq && !c.disposed) { c.pendingBet = null; syncDraft(); setBetNotice('전송 실패: 마지막 승인 내역으로 복원했습니다.'); }
                });
            };
            const handleReady = () => {
                const c = client.current;
                if (!canAct('BETTING') || isItemSelecting) return;
                sendBet(c.draftBets, c.draftItem, !c.draftReady);
            };
            const handleBet = (hId, amt) => {
                const c = client.current;
                if (!canAct('BETTING') || !Number.isSafeInteger(amt) || amt <= 0) return;
                const total = Object.values(c.draftBets).reduce((a, b) => a + b, 0);
                if (total + amt > c.me.money) return alert('자본금이 부족합니다! 다음 판을 위해 아껴두세요.');
                sendBet({ ...c.draftBets, [hId]: (c.draftBets[hId] || 0) + amt }, c.draftItem); playSound('coin');
            };
            const handleBetAllIn = hId => {
                const c = client.current; if (!canAct('BETTING')) return;
                const remaining = c.me.money - Object.values(c.draftBets).reduce((a, b) => a + b, 0);
                if (remaining <= 0) return alert('더 이상 배팅할 자본금이 없습니다.'); handleBet(hId, remaining);
            };
            const handleResetBet = () => { if (!canAct('BETTING')) return; setIsItemSelecting(false); sendBet({}, null); };
            const handleItemBtnClick = () => {
                const c = client.current; if (!canAct('BETTING')) return;
                const item = ITEMS.find(i => i.id === c.me.inventory); if (!item) return;
                if (c.draftItem || isItemSelecting) { setIsItemSelecting(false); sendBet(c.draftBets, null); return; }
                if (['coin', 'insurance'].includes(item.id)) sendBet(c.draftBets, { target: 'self', itemId: item.id });
                else setIsItemSelecting(true);
            };
            const handleSelectTargetHorse = hId => {
                const c = client.current; if (!canAct('BETTING') || !isItemSelecting || !c.me.inventory) return;
                setIsItemSelecting(false); sendBet(c.draftBets, { target: 'horse', horseId: hId, itemId: c.me.inventory });
            };
            const handleCheer = horseId => {
                const c = client.current;
                if (!canAct('RACE') || c.cheerTimer || !(c.me.bets?.[horseId] > 0)) return;
                pushAction({ type: 'CHEER', seq: ++c.seq, horseId }); setCheerCooldown(true);
                c.cheerTimer = setTimeout(() => { c.cheerTimer = null; if (!c.disposed) setCheerCooldown(false); }, 1000); playSound('dash');
            };
            const connectionBanner = netMessage ? <div className="fixed top-0 left-0 right-0 z-[100] bg-amber-900/95 text-yellow-100 text-xs font-bold p-2 text-center">{netMessage}</div> : null;

            if(!roomState || !me) return <div className="h-full flex flex-col items-center justify-center text-white font-bold text-xl gap-4 p-6">{connectionBanner}호스트와 연결 중...<button className="text-sm underline text-slate-300" onClick={onExit}>처음으로</button></div>;

            if (roomState.status === 'LOBBY') {
                return (
                    <div className="h-full flex flex-col items-center justify-center text-center p-6 fade-in bg-teal-900">
                        {connectionBanner}
                        <div className="text-6xl mb-6 animate-bounce">📱</div>
                        <h2 className="text-3xl font-black text-white mb-4">대기방 접속 완료!</h2>
                        <p className="text-slate-400 font-bold mb-8">호스트 선생님이 게임을 시작할 때까지 기다려주세요.</p>
                        <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                            <AvatarDisplay avatarStr={me.avatar} sizeClasses="w-16 h-16 text-3xl mx-auto mb-2" />
                            <div className="text-xl font-black text-yellow-400">{me.name}</div>
                        </div>
                    </div>
                );
            }

            if (roomState.status === 'QUIZ') {
                return (
                    <div className="h-[100dvh] flex flex-col p-4 bg-teal-900 text-white fade-in overflow-hidden relative">
                        {connectionBanner}
                        <div className="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md shrink-0">
                            <div><div className="text-slate-400 text-xs font-bold mb-1">내 자본금</div><div className="text-2xl font-black text-emerald-400">{me.money}💰</div></div>
                            <div className="text-center">
                                <div className="text-slate-400 text-xs font-bold mb-1">남은 시간</div>
                                <div className={`text-xl font-black ${timeLeft <= 5 ? 'text-red-400 animate-pulse' : 'text-white'}`}>{timeLeft}초</div>
                            </div>
                            <div className="text-right"><div className="text-slate-400 text-xs font-bold mb-1">연속 정답</div><div className="text-xl font-black text-yellow-400">{combo} Combo! 🔥</div></div>
                        </div>
                        
                        {quizNotice && <div className="text-center text-xs font-bold text-amber-300 mb-2">{quizNotice}</div>}
                        {quizData && (
                            <div className="quiz-content flex-1 min-h-0 flex flex-col max-w-sm mx-auto w-full relative overflow-y-auto custom-scrollbar">
                                {/* 🌟 호스트가 상태를 변경하기 직전 네트워크 딜레이를 가려주는 0초 도달 오버레이 */}
                                {timeLeft === 0 && (
                                    <div className="absolute inset-0 z-[60] flex flex-col items-center justify-center bg-teal-900/90 backdrop-blur-sm rounded-2xl">
                                        <span className="text-5xl mb-4 animate-bounce">⏳</span>
                                        <span className="text-3xl font-black text-white">시간 종료!</span>
                                        <span className="text-slate-300 mt-2 font-bold text-sm">배팅 단계로 이동 중...</span>
                                    </div>

                                <div className="shrink-0 mt-auto text-center text-3xl sm:text-4xl font-black mb-6 p-6 sm:p-8 bg-slate-800 rounded-2xl border-2 border-indigo-500 shadow-[0_0_20px_rgba(99,102,241,0.3)] break-words w-full">
                                    <div className="text-sm text-slate-400 font-bold mb-2">영단어의 뜻을 고르세요.</div>
                                    <span data-quiz-word>{quizData.answer.eng}</span>
                                </div>
                                <div className="grid grid-cols-1 gap-3 shrink-0 mb-auto content-start relative">
                                    {quizData.options.map((option, optionIndex) => (
                                        <button key={optionIndex} data-quiz-option={optionIndex} onClick={()=>handleQuizAnswer(optionIndex)} className="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-black text-lg sm:text-xl rounded-2xl px-3 py-4 sm:py-5 shadow-lg transition-transform active:scale-95 border-b-4 border-indigo-800 active:border-b-0 active:translate-y-1 w-full whitespace-normal break-keep">

            };
            const a1 = pick(active.filter(p=>(p.stats.quizCnt||0)>0), p=>p.stats.quizCnt);
            const a2 = pick(active.filter(p=>(p.stats.totalBet||0)>0 || p.stats.betWin>0 || p.stats.betLoss>0), net);
            const a3 = pick(active.filter(p=>(p.stats.betLoss||0)>0), p=>p.stats.betLoss);
            const Card = ({icon, title, desc, name, val, cBorder, cText, avatarStr}) => (
                <div className={`bg-slate-800 p-5 rounded-2xl text-center border-t-4 ${cBorder} shadow-lg transform transition hover:scale-105 flex-1 mx-2 mb-4`}>
                    <div className="text-4xl mb-3">{icon}</div><div className={`text-lg font-black ${cText} mb-1`}>{title}</div><div className="text-[11px] text-slate-400 mb-3">{desc}</div>
                    <div className="flex justify-center mb-2"><AvatarDisplay avatarStr={avatarStr} sizeClasses="w-10 h-10 text-xl"/></div>
                    <div className="text-xl font-black text-white bg-teal-900 rounded-lg py-2 mb-2 truncate border border-slate-700 shadow-inner px-2">{name||'해당 없음'}</div><div className="text-emerald-400 font-black text-sm">{val}</div>
                </div>
            );
            return (
                <div className="flex flex-col md:flex-row justify-center max-w-4xl mx-auto w-full px-2">
                    <Card icon="🧠" title="지식의 탐구자" desc="퀴즈 최다 정답" name={a1?.name} avatarStr={a1?.avatar} val={a1 ? `${a1.stats.quizCnt}개${a1.tied?' (공동)':''}` : '—'} cBorder="border-blue-500" cText="text-blue-400"/>
                    <Card icon="🃏" title="경마장의 전설" desc="배팅 순수익 1위" name={a2?.name} avatarStr={a2?.avatar} val={a2 ? `${net(a2)>=0?'+':''}${net(a2)}💰${a2.tied?' (공동)':''}` : '—'} cBorder="border-red-500" cText="text-red-400"/>
                    <Card icon="💸" title="기부 천사" desc="배팅 손실액 1위" name={a3?.name} avatarStr={a3?.avatar} val={a3 ? `-${a3.stats.betLoss}💰${a3.tied?' (공동)':''}` : '—'} cBorder="border-slate-500" cText="text-slate-400"/>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
