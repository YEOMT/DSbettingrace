                                    <div className="flex items-start gap-3">
                                        <div className="text-4xl bg-teal-900 w-14 h-14 rounded-full flex items-center justify-center border border-slate-600 shadow-inner shrink-0 mt-1">{h.emoji}</div>
                                        <div className="min-w-0">
                                            <div className="font-black text-lg text-slate-100 leading-none mb-1.5">{h.name}</div>
                                            <div className="text-[11px] text-slate-400 font-bold leading-snug mb-1.5 break-keep pr-2">{h.desc}</div>
                                            <div className="text-sm text-red-400 font-black">예상 배당률: {h.odds}배</div>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center justify-end -mt-4 mb-2">
                                        <div className="text-lg font-black text-emerald-400 bg-teal-900 px-3 py-1 rounded-lg border border-slate-700">{(myBets[h.id] || 0)}💰</div>
                                    </div>

                                    <div className={`grid grid-cols-5 gap-1 sm:gap-2 mt-1 ${isItemSelecting ? 'opacity-30 pointer-events-none' : ''}`}>
                                        {[100, 500, 1000, 5000].map(amt => (
                                            <button key={amt} onClick={(e)=>{ e.stopPropagation(); handleBet(h.id, amt); }} className="bg-indigo-600/20 hover:bg-indigo-600/40 border border-indigo-500/40 text-indigo-300 py-2 sm:py-3 rounded-lg font-black text-[11px] sm:text-sm active:scale-95 transition whitespace-nowrap">+{amt}</button>
                                        ))}
                                        <button onClick={(e)=>{ e.stopPropagation(); handleBetAllIn(h.id); }} className="bg-red-600/20 hover:bg-red-600/40 border border-red-500/40 text-red-300 py-2 sm:py-3 rounded-lg font-black text-[11px] sm:text-sm active:scale-95 transition whitespace-nowrap">올인</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (roomState.status === 'RACE') {
                return (
                    <div className="h-[100dvh] flex flex-col p-4 bg-teal-900 text-white items-center justify-center overflow-hidden fade-in">
                        {connectionBanner}
                        <div className="text-center w-full max-w-md bg-slate-800 p-6 rounded-3xl border-2 border-slate-600 shadow-2xl flex flex-col items-center">
                            <h2 className="text-3xl font-black mb-2 text-yellow-400 animate-pulse font-display tracking-wide">🏁 경주 진행 중!</h2>
                            <p className="text-slate-400 mb-8 font-bold text-sm">배팅한 말을 응원하세요! (1초 쿨타임)</p>
                            <div className="grid grid-cols-2 gap-4 w-full">
                                {roomState.horses.map(h => {
                                    if(!myBets[h.id]) return null;
                                    return (
                                        <button key={h.id} onClick={()=>handleCheer(h.id)} disabled={cheerCooldown} className={`relative bg-slate-700 border-2 border-yellow-500/50 py-8 px-2 rounded-2xl flex flex-col items-center shadow-lg w-full overflow-hidden transition-all ${cheerCooldown ? 'opacity-60 cursor-not-allowed grayscale-[30%]' : 'active:scale-90 active:bg-slate-600'}`}>
                                            <div className="text-6xl mb-3 drop-shadow-md">{h.emoji}</div>
                                            <div className="font-black text-sm text-slate-100 truncate w-full px-2">{h.name}</div>
                                            <div className="text-xs font-bold text-emerald-400 mt-2 bg-teal-900 px-3 py-1 rounded-full">{myBets[h.id]}💰</div>
                                            
                                            {cheerCooldown && (
                                                <div className="absolute inset-0 bg-black/60 flex items-center justify-center backdrop-blur-[1px]">
                                                    <div className="text-white font-black text-xl flex items-center gap-2"><i className="fas fa-hourglass-half animate-spin"></i> 쿨타임</div>
                                                </div>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                            {Object.keys(myBets).length === 0 && (
                                <div className="py-12 text-slate-500 font-bold">배팅한 캐릭터가 없습니다.<br/>경기를 관람해주세요.</div>
                            )}
                        </div>
                    </div>
                );
            }

            if (roomState.status === 'RESULT') {
                return <>{connectionBanner}<ResultPhase me={me} /></>;
            }
            
            if (roomState.status === 'END_HORSE') {
                return (
                    <div className="h-[100dvh] flex flex-col items-center justify-center p-6 text-center bg-teal-900 fade-in">
                        {connectionBanner}
                        <h2 className="text-3xl font-black text-white animate-pulse">최종 결과 집계 중...</h2>
                        <p className="text-slate-400 mt-4 font-bold">선생님 화면을 주목해주세요!</p>
                    </div>
                );
            }

            if (roomState.status === 'END_PLAYER' || roomState.status === 'END_AWARDS') {
                return (
                    <div className="h-[100dvh] flex flex-col items-center justify-center p-6 text-center bg-teal-900 fade-in">
                        {connectionBanner}
                        <div className="text-6xl mb-4">🎁</div>
                        <h2 className="text-3xl font-black text-yellow-400 mb-6 font-display tracking-widest">수고하셨습니다!</h2>
                        {rewardDetails ? (
                            <div className="bg-slate-800 p-6 rounded-3xl border-2 border-slate-600 shadow-2xl w-full max-w-sm relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-400 to-blue-500"></div>
                                <h3 className="text-2xl font-black text-white mb-2">{me.name} 님의 최종 성적</h3>
                                <div className="text-3xl font-black text-emerald-400 mb-6">{rewardDetails.rank} 위</div>
                                
                                <div className="text-left bg-teal-900 p-4 rounded-xl mb-6 text-sm font-bold text-slate-300 border border-slate-700 shadow-inner">
                                    <div className="flex justify-between mb-2"><span className="flex items-center gap-2">🎖️ 기본 참가상</span><span className="text-emerald-400">+{rewardDetails.basic}</span></div>
                                    <div className="flex justify-between mb-2"><span className="flex items-center gap-2">🏅 순위 보너스</span><span className="text-yellow-400">+{rewardDetails.bonus}</span></div>
                                    <div className="border-t border-slate-700 my-3"></div>
                                    <div className="flex justify-between items-center"><span className="text-slate-400">획득 스킨 토큰</span><span className="text-2xl text-white font-black">{rewardDetails.total} 🪙</span></div>
                                </div>
                                <p className="text-xs text-slate-400 mb-6 font-bold leading-relaxed break-keep">받은 토큰으로 로비의<br/>[도감 & 뽑기]에서 새로운 스킨을 뽑아보세요!</p>
                                <button onClick={onExit} className="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 py-4 rounded-xl font-black text-white shadow-lg active:scale-95 transition text-lg">
                                    로비로 돌아가기
                                </button>
                            </div>
                        ) : (
                            finalPlayers.some(p=>p.uid===myUid) ? <div className="animate-spin rounded-full h-10 w-10 border-t-2 border-emerald-400"></div> : <div className="text-slate-300 font-bold">이번 경기는 종료되었습니다.<br/>다음 경기를 기다려 주세요.<button onClick={onExit} className="block mx-auto mt-6 underline">처음으로</button></div>
                        )}
                    </div>
                );
            }

            return null;
        }

        function RacePhase({ raceData, horses, isHost, onFinish }) {
            const finishCallback = useRef(onFinish); finishCallback.current = onFinish;
            const effectTimers = useRef(new Set());
            const pipElements = useRef(new Map());
            const scheduleEffect = (fn, delay) => { const id = setTimeout(() => { effectTimers.current.delete(id); fn(); }, delay); effectTimers.current.add(id); return id; };
            useEffect(() => () => { effectTimers.current.forEach(clearTimeout); effectTimers.current.clear(); }, []);
            const containerRef = useRef(null);
            const worldRef = useRef(null);
            const horseRefs = useRef([]);
            const pipRef = useRef(null);
            const hudDistRef = useRef(null);
            const dustLayerRef = useRef(null);
            const evtContainerRef = useRef(null);
            const particleContainerRef = useRef(null);
            const cheerTickerRef = useRef(null); 

            const playback = useRef({ startMs: null, lastTs: null, currentTick: 0, lastEvtTick: -1, spurt: false, camX: null });
            const leadTracker = useRef({ currentLeaderIdx: -1, lastLeadChangeTick: -999 });
            const cheerEffects = useRef([]); 

            const [isSpurtCSS, setIsSpurtCSS] = useState(false);
            const [isDramatic, setIsDramatic] = useState(false); 

            const TRACK_LENGTH = raceData ? raceData.distance : 6000;
            const VISUAL_SCALE = 15; 
            const START_OFFSET = 1000; 
            const TRACK_CY = 4000;
            const ZOOM_SCALE = isHost ? 0.48 : 0.3;

            const getTrackPos = (pos, lateral) => { return { x: START_OFFSET + (pos * VISUAL_SCALE), y: TRACK_CY + lateral }; };

            const createDust = (x, y) => {
                if(!dustLayerRef.current) return;
                const el = document.createElement('div');
                el.className = 'dust';
                el.style.left = `${x - (Math.random()-0.5)*40 - 60}px`; 
                el.style.top = `${y + (Math.random()-0.5)*40}px`;
                dustLayerRef.current.appendChild(el);
                scheduleEffect(() => el.remove(), 700);
            };

            useEffect(() => { playSound('start'); }, []);

            useEffect(() => {
                cheerEffects.current = horses.map(() => 0); 
                const cheerCounts = horses.map(() => 0); 
                
                const onCheer = (e) => {
                    const { horseId, playerName } = e.detail;
                    const hIdx = horses.findIndex(h => h.id === horseId);
                    
                    if (hIdx > -1) {
                        cheerCounts[hIdx] += 1;
                        cheerEffects.current[hIdx] = 100; 
                        
                        if (isHost && cheerTickerRef.current && playerName) {
                            const ticker = document.createElement('div');
                            ticker.className = 'text-sm font-black text-yellow-300 bg-black/60 px-3 py-1 rounded-full mb-1 border border-yellow-500/50 shadow-md animate-slide-in';
                            ticker.textContent = `${playerName}님이 ${horses[hIdx].name} 응원 중! 🔥`;
                            cheerTickerRef.current.appendChild(ticker);
                            scheduleEffect(() => ticker.remove(), 2000);
                        }
                        
                        if (cheerCounts[hIdx] >= 5) {
                            cheerCounts[hIdx] = 0;
                            if (particleContainerRef.current) {
                                const el = document.createElement('div');
                                el.className = 'cheer-particle';
                                el.innerHTML = `<span style="display:inline-block; transform:scaleX(-1); filter:hue-rotate(50deg) saturate(2);">${horses[hIdx].emoji}</span>`;
                                el.style.left = `${10 + Math.random() * 80}%`;
                                particleContainerRef.current.appendChild(el);
                                scheduleEffect(() => el.remove(), 1200);

                                if(horseRefs.current[hIdx]) {
                                    const burst = document.createElement('div');
                                    burst.className = 'absolute z-50 text-6xl drop-shadow-[0_0_20px_rgba(255,255,255,1)]';
                                    burst.style.animation = 'cheerExplode 0.8s ease-out forwards';
                                    burst.innerHTML = `✨💥✨`;
                                    horseRefs.current[hIdx].appendChild(burst);
                                    
                                    horseRefs.current[hIdx].classList.add('flash-horse');
                                    scheduleEffect(() => {
                                        burst.remove();
                                        horseRefs.current[hIdx]?.classList.remove('flash-horse');
                                    }, 800);
                                }
                            }
                        } else {
                            if (isHost && particleContainerRef.current) {
                                const el = document.createElement('div');
                                el.className = 'cheer-particle';
                                el.innerHTML = `<span style="display:inline-block; transform:scaleX(-1);">${horses[hIdx].emoji}</span>`;
                                el.style.left = `${10 + Math.random() * 80}%`;
                                particleContainerRef.current.appendChild(el);
                                scheduleEffect(() => el.remove(), 1200);
                            }
                        }
                    }
                };

                window.addEventListener('HORSE_CHEER', onCheer);
                return () => window.removeEventListener('HORSE_CHEER', onCheer);
            }, [horses, isHost]);

            useEffect(() => {
                if(!raceData || !worldRef.current || !containerRef.current) return;
                
                playback.current = { startMs: null, lastTs: null, currentTick: 0, lastEvtTick: -1, spurt: false, camX: START_OFFSET };
                leadTracker.current = { currentLeaderIdx: -1, lastLeadChangeTick: -999 };
                
                const totalMs = 18000;
                const ticks = raceData.timeline.length - 1;
                const msPerTick = totalMs / ticks;
                let animId, finishTimer = null, disposed = false;
                pipElements.current.clear(); if (pipRef.current) pipRef.current.replaceChildren();

                const step = (ts) => {
                    if(!playback.current.startMs) { playback.current.startMs = ts; playback.current.lastTs = ts; }
                    
                    const dt = ts - playback.current.lastTs;
                    playback.current.lastTs = ts;
                    let tickDelta = dt / msPerTick;
                    
                    const safeTimelineIndex = Math.min(Math.floor(playback.current.currentTick), ticks);
                    const currentTimelineData = raceData.timeline[safeTimelineIndex] || {};
                    const pMaxPos = Math.max(...(currentTimelineData.positions || [0]));
                    const pProgress = pMaxPos / TRACK_LENGTH;

                    if(pProgress > 0.8 && !playback.current.spurt) {
                        playback.current.spurt = true; 
                        setIsSpurtCSS(true); 
                        playSound('dash'); 
                    }

                    if (pProgress > 0.85 && pProgress < 0.98) {
                        const cPos = currentTimelineData.positions || [];
                        const sortedPos = [...cPos].sort((a,b)=>b-a);
                        const gap1st2nd = sortedPos[0] - (sortedPos[1] || 0);
                        
                        if (gap1st2nd < 150) {
                            tickDelta *= 0.3; 
                            setIsDramatic(true);
                        } else {
                            setIsDramatic(false);
                        }
                    } else {
                        setIsDramatic(false);
                    }

                    playback.current.currentTick += tickDelta;
                    let exTick = playback.current.currentTick;

                    if (exTick >= ticks) {
                        exTick = ticks; cancelAnimationFrame(animId);
                        if (isHost && !finishTimer) finishTimer = scheduleEffect(() => { if (!disposed) finishCallback.current?.(raceData.roundId); }, 3000);
                    } else {
                        animId = requestAnimationFrame(step);
                    }

                    const t1 = Math.floor(exTick), t2 = Math.min(t1+1, ticks), frac = exTick - t1;
                    const frame1 = raceData.timeline[t1] || {};
                    const frame2 = raceData.timeline[t2] || frame1;
                    
                    const p1 = frame1.positions?.length ? frame1.positions : horses.map(()=>0);
                    const p2 = frame2.positions?.length ? frame2.positions : p1;
                    const spds = frame1.speeds?.length ? frame1.speeds : horses.map(()=>0);
                    const lats1 = frame1.laterals?.length ? frame1.laterals : horses.map((_,i) => (i - 3.5)*120);
                    const lats2 = frame2.laterals?.length ? frame2.laterals : lats1;
                    
                    const curPos = p1.map((p,i) => p*(1-frac) + p2[i]*frac);
                    
                    const activeRunners = curPos.map((pos, i) => ({pos, i})).filter(r => r.pos < TRACK_LENGTH + 50);
                    const hasFinisher = curPos.some(pos => pos >= TRACK_LENGTH);
                    let leadPos = hasFinisher ? TRACK_LENGTH + 60 : (activeRunners.length > 0 ? Math.max(...activeRunners.map(r => r.pos)) : TRACK_LENGTH + 60);

                    const leadData = getTrackPos(leadPos, 0);
                    playback.current.camX += (leadData.x - playback.current.camX) * 0.15;
                    
                    const cw = containerRef.current.clientWidth;
                    const ch = containerRef.current.clientHeight;
                    const tx = (cw * 0.35) - (playback.current.camX * ZOOM_SCALE);
                    const ty = (ch / 2) - (TRACK_CY * ZOOM_SCALE);
                    worldRef.current.style.transform = `translate(${tx}px, ${ty}px) scale(${ZOOM_SCALE})`;

                    const wantedPips = new Set(); 

                    const curRanks = new Array(horses.length);
                    const curStandings = curPos.map((p,i)=>({i,p})).sort((a,b)=> {
                        const af = a.p >= TRACK_LENGTH, bf = b.p >= TRACK_LENGTH;
                        if (af && bf) return raceData.ranks.indexOf(a.i) - raceData.ranks.indexOf(b.i);
                        if (af !== bf) return af ? -1 : 1;
                        return b.p - a.p;
                    });
                    curStandings.forEach((s, r) => curRanks[s.i] = r);
                    
                    let newLeaderIdx = curStandings[0].i;
                    let progress = leadPos / TRACK_LENGTH;

                    if (!hasFinisher && progress > 0.1 && newLeaderIdx !== leadTracker.current.currentLeaderIdx && (t1 - leadTracker.current.lastLeadChangeTick) > 25) {
                        if (leadTracker.current.currentLeaderIdx !== -1 && evtContainerRef.current) {
                            const el = document.createElement('div');
                            el.className = `p-3 rounded-2xl shadow-xl animate-slide-in mb-3 w-fit ${EVENT_STYLES.lead}`;
                            el.innerText = `${horses[newLeaderIdx].name}: ${getMsg(EVENT_MSGS.lead)}`;
                            evtContainerRef.current.appendChild(el);
                            scheduleEffect(() => el.remove(), 3000);
                        }
                        leadTracker.current.currentLeaderIdx = newLeaderIdx;
                        leadTracker.current.lastLeadChangeTick = t1;
                    }

                    curPos.forEach((pos, i) => {
                        cheerEffects.current[i] *= 0.9; 
                        const visualPos = pos;
                        const lat = lats1[i]*(1-frac) + lats2[i]*frac;
                        const { x, y } = getTrackPos(visualPos, lat);
                        
                        if(horseRefs.current[i]) {
                            horseRefs.current[i].style.left = `${x}px`;
                            horseRefs.current[i].style.top = `${y}px`;
                            horseRefs.current[i].style.zIndex = Math.floor(y + 100);

                            const finishLabel = horseRefs.current[i].querySelector('.runner-finish-rank');
                            if (finishLabel) { const finished = pos >= TRACK_LENGTH; finishLabel.hidden = !finished; if (finished) finishLabel.textContent = `${raceData.ranks.indexOf(i) + 1}위 골인`; }
                            const icon = horseRefs.current[i].querySelector('.runner-icon');
                            if(icon) {
                                if(spds[i] > 10 || cheerEffects.current[i] > 10) icon.classList.add('active');
                                else icon.classList.remove('active');
                                
                                if (cheerEffects.current[i] > 30) {
                                    icon.style.filter = 'drop-shadow(0 0 40px rgba(250,204,21,1)) brightness(1.3)';
                                } else {
                                    icon.style.filter = ''; 
                                }
                            }
                        }

                        const screenX = tx + (x * ZOOM_SCALE);
                        if (screenX < -150) { 
                            wantedPips.add(i);
                            if (pipRef.current) {
                                let entry = pipElements.current.get(i);
                                if (!entry) {
                                    const el = document.createElement('div'); el.className = 'pip-item'; el.dataset.horseId = horses[i].id;
                                    const emoji = document.createElement('div'); emoji.className = 'pip-emoji'; emoji.textContent = horses[i].emoji;
                                    const info = document.createElement('div'); info.className = 'pip-info';
                                    const name = document.createElement('div'); name.className = 'pip-name'; name.textContent = horses[i].name;
                                    const distance = document.createElement('div'); distance.className = 'pip-dist';
                                    info.append(name, distance); el.append(emoji, info); pipRef.current.appendChild(el);
                                    entry = { el, distance }; pipElements.current.set(i, entry);
                                }
                                const label = pos >= TRACK_LENGTH ? `${raceData.ranks.indexOf(i) + 1}위 골인` : `${Math.floor(visualPos)}m`;
                                if (entry.distance.textContent !== label) entry.distance.textContent = label;
                            }
                        }
                        if(spds[i] > 60 && Math.random() < 0.1 && !isDramatic) createDust(x, y); 
                    });

                    if(hudDistRef.current) hudDistRef.current.innerText = `${Math.min(Math.floor(Math.max(...curPos)), TRACK_LENGTH)}m`;
                    pipElements.current.forEach((entry, key) => { if (!wantedPips.has(key)) { entry.el.remove(); pipElements.current.delete(key); } });

                    const evs = frame1.events || [];
                    if (t1 !== playback.current.lastEvtTick && evs.length > 0) {
                        evs.forEach(e => {
                            if(evtContainerRef.current) {
                                const el = document.createElement('div');
                                el.className = `p-3 rounded-2xl shadow-xl animate-slide-in mb-3 w-fit ${EVENT_STYLES[e.type] || EVENT_STYLES.normal}`;
                                el.innerText = `${horses[e.hIdx].name}: ${e.msg}`;
                                evtContainerRef.current.appendChild(el);
                                scheduleEffect(() => el.remove(), 2500);
                            }
                        });
                        playback.current.lastEvtTick = t1;
                    }
                };
                animId = requestAnimationFrame(step);
                return () => { disposed = true; cancelAnimationFrame(animId); clearTimeout(finishTimer); pipElements.current.clear(); };
            }, [raceData, isHost]);

            if(!raceData) return <div className="h-full flex items-center justify-center"><div className="animate-spin rounded-full h-10 w-10 border-t-2 border-white"></div></div>;

            const pStart = { x: START_OFFSET - 2000, y: TRACK_CY };
            const pEnd = { x: START_OFFSET + TRACK_LENGTH * VISUAL_SCALE + 3000, y: TRACK_CY };
            const dPath = `M ${pStart.x} ${pStart.y} L ${pEnd.x} ${pEnd.y}`;

            const weatherClass = raceData.weather.id === 'RAIN' ? 'weather-rain' : (raceData.weather.id === 'HEAT' ? 'weather-heat' : (raceData.weather.id === 'WIND' ? 'weather-wind' : ''));
            const trackColorClass = `track-${raceData.weather.id}`;

            return (
                <div id="race-track-container" ref={containerRef} className={`${isSpurtCSS ? 'camera-shake slow-motion' : ''} ${isDramatic ? 'is-dramatic' : ''}`}>
                    {weatherClass && <div className={`weather-layer ${weatherClass}`}></div>}
                    <div className="dramatic-overlay"></div>

                    <div className="absolute top-8 left-1/2 -translate-x-1/2 z-40 flex flex-col items-center">
                        <div className="bg-black/80 px-10 py-3 rounded-2xl border-2 border-yellow-500 shadow-2xl text-center transition-all duration-500">
                            <div className="text-yellow-400 font-bold text-lg tracking-widest mb-[-8px]">🏁 GOAL: {TRACK_LENGTH}m</div>
                            <div ref={hudDistRef} className="text-white font-black text-6xl font-display drop-shadow-md">0m</div>
                        </div>
                        {raceData.weather.id !== 'SUNNY' && (
                            <div className="mt-2 bg-slate-800/80 px-4 py-1 rounded-full font-bold text-sm border border-slate-600 backdrop-blur-sm">
                                <span className={raceData.weather.color}>{raceData.weather.name}</span>
                            </div>
                        )}
                        {isDramatic && <div className="mt-4 text-red-500 font-black text-2xl animate-pulse font-display drop-shadow-md">🔥 숨 막히는 초접전! 🔥</div>}
                    </div>

                    {isHost && <div ref={cheerTickerRef} className="absolute top-8 right-8 z-40 flex flex-col items-end pointer-events-none"></div>}

                    <div id="pip-container" ref={pipRef}></div>
                    {isSpurtCSS && !isDramatic && <div id="slow-mo-overlay"></div>}

                    <div id="track-world" ref={worldRef} className={trackColorClass}>
                        <svg className="track-path-svg" viewBox="0 0 120000 8000" preserveAspectRatio="none">
                            {/* 트랙 외곽선: 짙은 잔디색 */}
                            <path d={dPath} fill="none" stroke="#166534" strokeWidth="1200" strokeLinecap="square" />
                            {/* 트랙 안쪽: 밝고 선명한 잔디색 */}
                            <path d={dPath} fill="none" stroke="#22c55e" strokeWidth="1100" strokeLinecap="square" />
                            
                            {[-3,-2,-1,0,1,2,3,4].map(i => {
                                const offset = i * 120 - 60;
                                const lPath = `M ${pStart.x} ${pStart.y + offset} L ${pEnd.x} ${pEnd.y + offset}`;
                                return <path key={i} d={lPath} fill="none" stroke="rgba(255,255,255,0.2)" strokeWidth="12" strokeDasharray="100, 100" />;
                            })}
                            
                            <line x1={START_OFFSET} y1={pStart.y - 550} x2={START_OFFSET} y2={pStart.y + 550} stroke="white" strokeWidth="60" />
                            <line x1={START_OFFSET + TRACK_LENGTH * VISUAL_SCALE} y1={pEnd.y - 550} x2={START_OFFSET + TRACK_LENGTH * VISUAL_SCALE} y2={pEnd.y + 550} stroke="white" strokeWidth="60" />
                            <line x1={START_OFFSET + TRACK_LENGTH * VISUAL_SCALE + 60} y1={pEnd.y - 550} x2={START_OFFSET + TRACK_LENGTH * VISUAL_SCALE + 60} y2={pEnd.y + 550} stroke="#fbbf24" strokeWidth="60" strokeDasharray="60,60" />
                        </svg>

                        <div ref={dustLayerRef} className="absolute inset-0 pointer-events-none z-10"></div>
                        
                        {horses.map((h, i) => {
                            const isFlipped = h.id !== 12 && h.id !== 21 && !h.img;
                            return (
                            <div key={h.id} ref={el=>horseRefs.current[i]=el} className="runner">
                                <div className="runner-name-tag">
                                    <div className="name">{h.name}</div><div className="runner-finish-rank text-yellow-300 text-xl" hidden></div>
                                    {raceData.sponsors && raceData.sponsors[h.id] && (
                                        <div className="sponsor">🏆 {raceData.sponsors[h.id]}</div>
                                    )}
                                </div>
                                <div className="runner-icon drop-shadow-[0_15px_15px_rgba(0,0,0,0.8)] overflow-hidden rounded-full flex items-center justify-center transition-all duration-300">
                                    {h.img ? <img src={h.img} className="w-full h-full object-cover" alt=""/> : <span className={`inline-block ${isFlipped ? '-scale-x-100' : ''}`}>{h.emoji}</span>}
                                </div>
                            </div>
                            )
                        })}
                    </div>

                    <div ref={evtContainerRef} className="absolute bottom-10 left-6 z-40 pointer-events-none flex flex-col items-start w-[600px] overflow-hidden font-display tracking-wide"></div>
                    
                    <div ref={particleContainerRef} className="absolute inset-0 pointer-events-none z-50 overflow-hidden"></div>
                </div>
            );
        }

        function ResultPhase({ me }) {
            return (
                <div className="h-[100dvh] flex flex-col p-6 max-w-md mx-auto fade-in text-center items-center justify-center bg-teal-900 w-full">
                    <h2 className="text-3xl font-black text-slate-200 mb-8 font-display tracking-wide">라운드 정산 결과</h2>
                    <div className="bg-slate-800 border border-slate-700 p-8 rounded-3xl w-full shadow-2xl mb-8 flex flex-col gap-3">
                        <div className="text-sm font-bold text-slate-400 mb-2">배팅금: {me.lastCost||0}💰</div>
                        <div className="text-lg font-bold text-slate-300">당첨 수령액: {Math.floor(me.lastGrossWin||0)} 💰</div>
                        <div className={`text-5xl font-black my-4 drop-shadow-md ${me.lastWin>0?'text-red-400':(me.lastWin<0?'text-blue-400':'text-slate-300')}`}>
                            {me.lastWin>0?'+':''}{Math.floor(me.lastWin||0)}
                        </div>
                        <div className="text-sm text-slate-500 font-bold mb-4">이번 판 순수익</div>
                        <div className="mt-4 text-emerald-400 font-black bg-teal-900 py-4 rounded-xl border border-slate-700 text-2xl shadow-inner">최종 잔액: {Math.floor(me.money)} 💰</div>
                    </div>
                    <p className="text-slate-400 font-bold animate-pulse text-lg">호스트 대기중...</p>
                </div>
            );
        }

        function HorsePodium({ horses, ranks }) {
            const h1=horses[ranks[0]], h2=horses[ranks[1]], h3=horses[ranks[2]];
            return (
                <div className="flex justify-center items-end gap-3 h-56 mb-8 px-4">
                    <div className="w-1/3 flex flex-col items-center animate-rise" style={{animationDelay:'0.3s'}}>
                        <div className="text-4xl md:text-5xl mb-1">{h2.emoji}</div><div className="font-black text-sm md:text-base text-slate-300 truncate w-full text-center">{h2.name}</div>
                        <div className="w-full h-24 podium-2 rounded-t-xl mt-2 flex items-start justify-center pt-2 shadow-lg"><span className="font-black text-slate-700 text-2xl font-display">2</span></div>
                    </div>
                    <div className="w-[40%] flex flex-col items-center animate-rise z-10" style={{animationDelay:'0.6s'}}>
                        <div className="text-5xl md:text-6xl mb-1 animate-bounce">{h1.emoji}</div><div className="font-black text-base md:text-lg text-yellow-400 truncate w-full text-center">{h1.name}</div>
                        <div className="w-full h-36 podium-1 rounded-t-xl mt-2 flex items-start justify-center pt-3 shadow-2xl border-t border-yellow-200"><span className="font-black text-yellow-900 text-3xl font-display">1</span></div>
                    </div>
                    <div className="w-1/3 flex flex-col items-center animate-rise" style={{animationDelay:'0s'}}>
                        <div className="text-3xl md:text-4xl mb-1">{h3.emoji}</div><div className="font-black text-sm md:text-base text-orange-400 truncate w-full text-center">{h3.name}</div>
                        <div className="w-full h-16 podium-3 rounded-t-xl mt-2 flex items-start justify-center pt-1 shadow-lg"><span className="font-black text-orange-900 text-xl font-display">3</span></div>
                    </div>
                </div>
            );
        }

        function PlayerPodium({ players }) {
            const s = [...players].sort((a,b)=>b.money-a.money);
            const p1=s[0], p2=s[1], p3=s[2];
            return (
                <div className="flex justify-center items-end gap-3 h-56 mb-8 px-4">
                    {p2 && <div className="w-1/3 flex flex-col items-center animate-rise" style={{animationDelay:'0.3s'}}><div className="font-black text-base md:text-lg truncate w-full text-slate-200 text-center flex flex-col items-center gap-1"><AvatarDisplay avatarStr={p2.avatar} sizeClasses="w-8 h-8 text-base"/>{p2.name}</div><div className="text-xs text-emerald-400 font-bold mb-1">{Math.floor(p2.money)}</div><div className="w-full h-24 podium-2 rounded-t-xl mt-1 flex items-start justify-center pt-2 shadow-lg"><span className="font-black text-slate-700 text-2xl font-display">2</span></div></div>}
                    {p1 && <div className="w-[40%] flex flex-col items-center animate-rise z-10" style={{animationDelay:'0.6s'}}><div className="text-3xl mb-1">👑</div><div className="font-black text-lg md:text-xl text-yellow-400 truncate w-full drop-shadow-md text-center flex flex-col items-center gap-1"><AvatarDisplay avatarStr={p1.avatar} sizeClasses="w-10 h-10 text-xl"/>{p1.name}</div><div className="text-sm text-emerald-400 font-black mb-1">{Math.floor(p1.money)}</div><div className="w-full h-36 podium-1 rounded-t-xl mt-1 flex items-start justify-center pt-3 shadow-2xl border-t border-yellow-200"><span className="font-black text-yellow-900 text-3xl font-display">1</span></div></div>}
                    {p3 && <div className="w-1/3 flex flex-col items-center animate-rise" style={{animationDelay:'0s'}}><div className="font-black text-base md:text-lg truncate w-full text-orange-300 text-center flex flex-col items-center gap-1"><AvatarDisplay avatarStr={p3.avatar} sizeClasses="w-8 h-8 text-base"/>{p3.name}</div><div className="text-xs text-emerald-400 font-bold mb-1">{Math.floor(p3.money)}</div><div className="w-full h-16 podium-3 rounded-t-xl mt-1 flex items-start justify-center pt-1 shadow-lg"><span className="font-black text-orange-900 text-xl font-display">3</span></div></div>}
                </div>
            );
        }

        function SpecialAwards({ players }) {
            const active = players.filter(p => (p.stats?.quizCnt || 0) > 0 || (p.stats?.totalBet || 0) > 0 || (p.stats?.betWin || 0) > 0 || (p.stats?.betLoss || 0) > 0);
            if (active.length === 0) return null;
            const net = p => (p.stats?.betWin || 0) - (p.stats?.betLoss || 0);
            const pick = (list, score) => {
                if (!list.length) return null;
                const sorted = [...list].sort((a,b)=>score(b)-score(a)), best = sorted[0];
                const tied = sorted.filter(p=>score(p)===score(best));
                return tied.length > 1 ? { ...best, name: tied.map(p=>p.name).join(' · '), avatar: '', tied: true } : best;
            };
            const a1 = pick(active.filter(p=>(p.stats.quizCnt||0)>0), p=>p.stats.quizCnt);
            const a2 = pick(active.filter(p=>(p.stats.totalBet||0)>0 || p.stats.betWin>0 || p.stats.betLoss>0), net);
            const a3 = pick(active.filter(p=>(p.stats.betLoss||0)>0), p=>p.stats.betLoss);
            const Card = ({icon, title, desc, name, val, cBorder, cText, avatarStr}) => (
                <div className={`bg-slate-800 p-5 rounded-2xl text-center border-t-4 ${cBorder} shadow-lg transform transition hover:scale-105 flex-1 mx-2 mb-4`}>
                    <div className="text-4xl mb-3">{icon}</div><div className={`text-lg font-black ${cText} mb-1`}>{title}</div><div className="text-[11px] text-slate-400 mb-3">{desc}</div>
                    <div className="flex justify-center mb-2"><AvatarDisplay avatarStr={avatarStr} sizeClasses="w-10 h-10 text-xl"/></div>
                    <div className="text-xl font-black text-white bg-teal-900 rounded-lg py-2 mb-2 truncate border border-slate-700 shadow-inner px-2">{name||'해당 없음'}</div><div className="text-emerald-400 font-black text-sm">{val}</div>
                </div>
            );
            return (
                <div className="flex flex-col md:flex-row justify-center max-w-4xl mx-auto w-full px-2">
                    <Card icon="🧠" title="지식의 탐구자" desc="퀴즈 최다 정답" name={a1?.name} avatarStr={a1?.avatar} val={a1 ? `${a1.stats.quizCnt}개${a1.tied?' (공동)':''}` : '—'} cBorder="border-blue-500" cText="text-blue-400"/>
                    <Card icon="🃏" title="경마장의 전설" desc="배팅 순수익 1위" name={a2?.name} avatarStr={a2?.avatar} val={a2 ? `${net(a2)>=0?'+':''}${net(a2)}💰${a2.tied?' (공동)':''}` : '—'} cBorder="border-red-500" cText="text-red-400"/>
                    <Card icon="💸" title="기부 천사" desc="배팅 손실액 1위" name={a3?.name} avatarStr={a3?.avatar} val={a3 ? `-${a3.stats.betLoss}💰${a3.tied?' (공동)':''}` : '—'} cBorder="border-slate-500" cText="text-slate-400"/>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
